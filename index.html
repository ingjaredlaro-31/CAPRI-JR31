  height:1px;background:linear-gradient(90deg,transparent,var(--oro),transparent);opacity:.55}

  width:44px;height:44px;border-radius:12px;font-size:18px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:all .15s}
.temabtn:hover{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#0A0E15}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--fondo);color:var(--tinta);font-family:var(--body);font-size:18.5px;line-height:1.62;min-height:100dvh}
h1,h2,h3,.disp{font-family:var(--disp);text-transform:uppercase;margin:0;font-weight:700}
.mono{font-family:var(--mono)}
button,input,select,textarea{font-family:inherit;font-size:18px}
button{color:var(--tinta)}
a{color:var(--azul)}

.top{background:linear-gradient(180deg,#101827 0%,#0C121E 100%);color:#fff;
  padding:15px 20px 16px;padding-top:calc(15px + env(safe-area-inset-top));
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid #1E2838;box-shadow:0 4px 22px rgba(0,0,0,.35);position:relative}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,var(--oro) 0%,var(--oro) 46%,transparent 46%,transparent 54%,var(--rojo) 54%,var(--rojo) 100%)}
.top .marca{font-family:var(--mono);font-size:10.5px!important;letter-spacing:.26em!important;
  color:#8494AD!important;text-transform:uppercase}
.top .tt{font-family:var(--disp);font-weight:800;font-size:31px!important;line-height:1!important;
  color:#fff;margin-top:3px;letter-spacing:.01em}
.top .tt .bi{font-family:var(--body);font-size:12.5px;font-weight:400;letter-spacing:.04em;
  text-transform:none;color:#7C8AA3;margin-top:2px}
.top .quien{text-align:right;line-height:1.2}
.top .quien b{font-family:var(--disp);font-size:19px;font-weight:700;color:#fff;display:block}
.top .quien span{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--oro);text-transform:uppercase}
.top .quien a{color:#7C8AA3;font-size:12.5px;text-decoration:none;margin-left:8px}
.top .quien a:hover{color:var(--rojo)}
@media(max-width:640px){
  .top{padding:12px 14px 13px}
  .top .tt{font-size:25px!important}
  .top .quien b{font-size:15px}
}
.top .marca{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:#C3D6F7}
.top .t{font-family:var(--disp);font-weight:800;font-size:24px;line-height:1.05}
.top .who{text-align:right;font-size:12.5px;color:#C3D6F7;line-height:1.3}
.top .who b{display:block;color:#fff;font-size:14px}
.franja{height:3px;background:var(--rojo)}
.franja.split{display:flex}.franja.split i{flex:1;display:block;height:100%}
.franja.split i:first-child{background:var(--azul)}.franja.split i:last-child{background:var(--rojo)}

main{padding:14px;padding-bottom:96px;max-width:1400px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:var(--sup);
  backdrop-filter:blur(8px);border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 14px rgba(11,13,17,.06)}
nav button svg{display:block;margin:0 auto 3px;width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
nav button{flex:1;background:none;border:0;border-top:3px solid transparent;color:var(--gris);padding:9px 1px 11px;
  font-family:var(--disp);font-size:13px;text-transform:uppercase;cursor:pointer;position:relative;letter-spacing:.02em}
nav button.on{color:var(--azul);border-top-color:var(--azul)}
nav .dot{position:absolute;top:5px;right:calc(50% - 24px);width:7px;height:7px;border-radius:50%;background:var(--rojo)}
.side{display:none}

#root{width:100%;display:flex;flex-direction:column;min-height:100dvh}
@media(min-width:900px){
  body{display:flex;min-height:100dvh}
  #root{flex-direction:row;flex:1;min-width:0}
  .side{display:block;width:210px;flex-shrink:0;background:var(--tinta);position:sticky;top:0;height:100dvh;overflow-y:auto}
  .side .head{padding:16px 14px;border-bottom:1px solid #1F242C}
  .side .head .m{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--gris)}
  .side .head .j{font-family:var(--disp);font-weight:800;font-size:25px;color:#fff;letter-spacing:.08em}
  .side button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;
    border-left:3px solid transparent;color:#9AA3AF;padding:13px 16px;font-family:var(--disp);font-size:19px;
    text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s}
  .side button:hover{background:#141922;color:#E7EBEE}
  .side button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .side button.on{background:var(--azul);color:#fff;border-left-color:#5B8DEF}
  body.tec.clean .side button.on{background:var(--rojo);border-left-color:#F5A0A4}
  .wrap{flex:1;min-width:0;max-width:100%}
  nav{display:none}
  body.tec main{max-width:960px}
  main{padding:18px 22px 40px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
}

.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.18em;color:var(--gris);text-transform:uppercase;
  margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--linea)}
.eyebrow:first-child{margin-top:2px}
.card{background:var(--sup);border:1px solid var(--linea);border-left:4px solid var(--azul);border-radius:0 10px 10px 0;
  padding:15px 16px;margin-bottom:11px;box-shadow:0 1px 2px rgba(11,13,17,.04)}
.card.rojo{border-left-color:var(--rojo)} .card.ambar{border-left-color:var(--ambar)} .card.gris{border-left-color:#9AA3AF}
.folio{font-family:var(--mono);font-size:14px;color:var(--azul)}
.meta{font-family:var(--mono);font-size:14.5px;color:var(--gris)}
.tit{font-family:var(--disp);font-size:26px;line-height:1.12;margin:5px 0 3px;letter-spacing:.005em}
.sub{font-size:16px;color:var(--gris)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;
  border:1px solid var(--linea);border-radius:5px;color:var(--gris);background:var(--sup2);white-space:nowrap}
.chip.azul{color:var(--azul-d);border-color:var(--azul-b);background:var(--azul-l)}
.chip.rojo{color:var(--rojo-d);border-color:var(--rojo-b);background:var(--rojo-l)}
.chip.ambar{color:var(--ambar-d);border-color:var(--ambar-b);background:var(--ambar-l)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--azul);color:#fff;border:0;
  border-radius:8px;padding:12px 18px;font-family:var(--disp);font-size:17px;font-weight:700;text-transform:uppercase;
  letter-spacing:.02em;cursor:pointer;text-decoration:none;box-shadow:0 1px 3px rgba(27,86,211,.25);transition:transform .12s}
.btn:active{transform:translateY(1px)}
/* Distintivos del encabezado */
.hd-b{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.hd-x{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;
  padding:6px 12px;border-radius:6px;color:#fff;border:1px solid transparent;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 2px 5px rgba(0,0,0,.18)}
.hd-x.fl{background:#0E7BD4;border-color:#57B0F5}
.hd-x.rm{background:#B8231F;border-color:#F08A87}
.hd-x.in{background:#5A6880;border-color:#A6B4C8}
.hd-x.pc{background:#0E7A52;border-color:#5FD6A4}
.hd-x.zp{background:#B07A0B;border-color:#F0C860}
/* Escoger tipo de trabajo en el reporte */
.tipo-sw{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:5px 0 4px}
.tipo-sw button{background:var(--sup);border:1.5px solid var(--linea);border-radius:10px;
  padding:13px 8px;cursor:pointer;text-align:center;transition:all .13s}
.tipo-sw button b{display:block;font-family:var(--disp);font-size:16px;color:var(--tinta)}
.tipo-sw button span{font-size:11px;color:var(--gris)}
.tipo-sw button.on{border-color:var(--azul);background:var(--azul-l)}
.tipo-sw button.on b{color:var(--azul)}
@media(max-width:520px){ .tipo-sw{grid-template-columns:1fr} }

.acc-l{display:flex;flex-wrap:wrap;gap:7px}
.acc-i{display:inline-flex;align-items:center;gap:6px;background:var(--sup2);
  border:1px solid var(--linea);border-radius:7px;padding:5px 10px;font-size:14px}
.acc-i em{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gris)}
.acc-i a{color:var(--azul);text-decoration:none;font-weight:600}
.acc-i a:hover{text-decoration:underline}

/* Galeria de fotos */
.gal-a{margin-bottom:13px}
.gal-t{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--gris);margin-bottom:6px}
.gal-t span{color:var(--azul)}
.gal-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.gal-f{aspect-ratio:1;border:1px solid var(--linea);border-radius:8px;overflow:hidden;
  padding:0;background:var(--sup2);cursor:pointer;transition:transform .1s,border-color .13s}
.gal-f:hover{transform:scale(.97);border-color:var(--azul)}
.gal-f img{width:100%;height:100%;object-fit:cover;display:block}
/* Visor */
#visor{position:fixed;inset:0;z-index:9500;display:flex;align-items:center;justify-content:center}
.vi-bg{position:absolute;inset:0;background:rgba(4,7,12,.93)}
.vi-img{position:relative;max-width:94vw;max-height:82vh;object-fit:contain;border-radius:8px}
.vi-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
  padding:14px 18px;color:#E8EDF5;font-size:14px;z-index:2}
.vi-top span{flex:1}
.vi-dl{color:var(--azul);font-size:13px;text-decoration:none}
.vi-x{background:rgba(255,255,255,.12);border:0;color:#fff;width:36px;height:36px;
  border-radius:50%;font-size:17px;cursor:pointer}
.vi-n{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);
  border:0;color:#fff;width:48px;height:48px;border-radius:50%;font-size:28px;cursor:pointer;z-index:2}
.vi-izq{left:14px} .vi-der{right:14px}
.vi-n:hover{background:rgba(255,255,255,.24)}

.fo-paso{background:var(--azul-l);border-left:3px solid var(--azul);border-radius:8px;
  padding:9px 12px;margin:10px 0 8px;font-size:13px;line-height:1.5}
.fo-paso b{font-family:var(--disp);font-size:15px;color:var(--azul);margin-right:2px}
.fo-c.sel{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-l)}
.fo-c.sel::after{content:'✓';position:absolute;top:4px;right:5px;width:19px;height:19px;
  background:var(--azul);color:#fff;border-radius:50%;font-size:12px;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.fo-num{position:absolute;top:4px;left:5px;background:rgba(6,10,18,.75);color:#fff;
  font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:4px}
.fo-barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0 2px}
.fo-barra span{font-size:13px;color:var(--gris);flex:1}

/* Fotos por area */
.fo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;margin-top:8px}
.fo-c{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;cursor:pointer;
  border:2px solid var(--linea);transition:border-color .13s,transform .1s}
.fo-c:hover{transform:scale(.97)}
.fo-c.ok{border-color:var(--verde)}
.fo-c img{width:100%;height:100%;object-fit:cover;display:block}
.fo-a{position:absolute;left:0;right:0;bottom:0;background:rgba(6,10,18,.82);color:#fff;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;padding:3px 5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo-c.ok .fo-a{background:rgba(30,122,80,.9)}
.chips button em{font-style:normal;opacity:.6;margin-left:4px;font-size:11px}
/* Esquema de danos */
.esq{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px;margin-top:6px}
.esq-a{border:2px solid var(--linea);border-radius:10px;overflow:hidden;background:var(--sup2)}
.esq-t{font-family:var(--disp);font-size:17px;padding:9px 11px 6px;text-transform:uppercase;line-height:1.1}
.esq-b{font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:#fff;padding:3px 11px;text-align:center}
.esq-d{padding:8px 11px;display:flex;flex-direction:column;gap:3px}
.esq-d span{font-size:12px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Ficha de ubicacion */
.ub-cab{display:flex;align-items:flex-start;gap:14px;padding-bottom:13px;
  border-bottom:1px solid var(--linea);margin-bottom:12px}
.ub-prop{flex:1;min-width:0}
.ub-prop b{display:block;font-family:var(--disp);font-size:23px;line-height:1.08;

.ub-prop span{display:block;font-size:14px;color:var(--gris);margin-top:3px}
.ub-un{flex-shrink:0;text-align:center;min-width:84px;

.ub-un span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--gris)}
.ub-un b{display:block;font-family:var(--disp);font-size:27px;line-height:1.05;color:var(--azul)}
.ub-un.falta{border-color:var(--rojo);border-style:dashed}

.ub-avi{display:flex;align-items:center;gap:11px;flex-wrap:wrap;

.ub-avi span{flex:1;min-width:180px}
.ub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:2px 16px}
.ub-d{padding:7px 0;border-bottom:1px solid var(--linea)}
.ub-d span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;
  color:var(--gris);margin-bottom:2px}
.ub-d b{font-size:15.5px;font-weight:600}
.ub-d b.mono{font-family:var(--mono);font-size:14px}
.ub-d.vacio b{color:var(--gris);font-weight:400;font-style:italic;font-size:14px}
.ub-map{font-size:15px;color:var(--azul);text-decoration:none;font-weight:600}
.ub-map:hover{text-decoration:underline}

/* ── Barra de búsqueda en la barra superior ── */
.buscabar{display:flex;align-items:center;gap:8px;flex:0 1 330px;min-width:150px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:9px;padding:0 12px;height:40px;margin:0 14px;
  transition:background .15s,border-color .15s,flex-basis .18s}
.buscabar:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.22)}
.buscabar:focus-within{background:rgba(255,255,255,.14);border-color:var(--azul);flex-basis:400px}
.bb-ic{color:#8FA2BC;font-size:16px;flex-shrink:0}
.buscabar input{flex:1;min-width:0;background:transparent;border:0;padding:0;
  color:#fff;font-size:14.5px;height:100%}
.buscabar input::placeholder{color:#7C8CA5}
.buscabar input:focus{outline:0}
.solomovil{display:none}
@media(max-width:640px){ .solomovil{display:inline-flex} }
.bb-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:#7C8CA5;
  border:1px solid rgba(255,255,255,.16);border-radius:4px;padding:2px 6px;flex-shrink:0}
@media(max-width:900px){ .bb-k{display:none} .buscabar{flex-basis:190px;margin:0 8px} }
@media(max-width:640px){ .buscabar{display:none} }

/* ── Zonas donde trabajamos ── */
.z-mapa{height:230px;border-radius:11px;overflow:hidden;border:1px solid var(--linea);
  margin-bottom:11px;background:var(--sup2)}
.z-lista{display:flex;flex-direction:column}
.z-r{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--linea)}
.z-r:last-child{border-bottom:0}
.z-m{font-size:19px;width:26px;text-align:center;flex-shrink:0}
.z-n{flex:1;min-width:0}
.z-n b{display:block;font-size:15.5px;font-weight:650}
.z-n span{font-size:12.5px;color:var(--gris)}
.z-bar{height:5px;background:var(--sup2);border-radius:3px;margin-top:5px;overflow:hidden}
.z-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--azul),var(--oro));border-radius:3px}
.z-d{text-align:right;flex-shrink:0}
.z-d b{display:block;font-family:var(--disp);font-size:19px;line-height:1}
.z-d span{font-size:11px;color:var(--gris)}

/* ── Rastro de ubicación ── */
.ra-t{background:var(--sup);border:1px solid var(--linea);border-radius:10px;
  padding:11px 14px;margin-bottom:11px}
.ra-h{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  padding-bottom:9px;border-bottom:1px solid var(--linea)}
.ra-h b{font-family:var(--disp);font-size:19px}
.ra-h span{font-size:13px;color:var(--gris)}
.ra-h .btn{margin-left:auto}
.ra-l{display:flex;flex-direction:column}
.ra-p{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--linea)}
.ra-p:last-child{border-bottom:0}
.ra-ic{font-family:var(--mono);font-size:13px;color:var(--azul);width:16px;text-align:center}
.ra-hh{font-family:var(--mono);font-size:14px;font-weight:600;width:56px;flex:0 0 56px}
.ra-tx{flex:1;min-width:0}
.ra-tx b{display:block;font-size:14.5px;font-weight:600}
.ra-tx em{font-style:normal;font-size:12.5px;color:var(--gris);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra-go{font-family:var(--mono);font-size:11px;color:var(--azul);text-decoration:none;flex-shrink:0}
.ra-go:hover{text-decoration:underline}

/* ── Arranque del día ── */
.ar-box{background:var(--sup);border:1px solid var(--linea);border-radius:10px;
  padding:10px 13px;margin-bottom:14px}
.ar-cab{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding-bottom:9px;border-bottom:1px solid var(--linea)}
.ar-cab b{font-family:var(--disp);font-size:21px;line-height:1;margin-right:5px}
.ar-cab i{font-style:normal;font-size:14px;color:var(--gris)}
.ar-cab span{font-size:13px;color:var(--gris)}
.ar-cab .btn{margin-left:auto;min-height:38px;padding:9px 15px;font-size:14px}
.ar-tecs{display:flex;flex-direction:column}
.ar-t{display:flex;align-items:center;gap:10px;padding:9px 2px;
  border-bottom:1px solid var(--linea);cursor:pointer;transition:background .13s}
.ar-t:last-child{border-bottom:0}
.ar-t:hover{background:var(--sup2)}
.ar-pt{width:8px;height:8px;border-radius:50%;background:var(--linea);flex-shrink:0}
.ar-pt.on{background:var(--verde);box-shadow:0 0 0 3px rgba(61,214,140,.18)}
.ar-n{flex:1;min-width:0}
.ar-n b{display:block;font-size:16px;font-weight:650;line-height:1.2}
.ar-n span{font-size:13px;color:var(--gris)}
.ar-d{text-align:right;flex-shrink:0;display:flex;align-items:baseline;gap:6px}
.ar-d b{font-family:var(--disp);font-size:21px;line-height:1}
.ar-d span{font-size:12.5px;color:var(--gris)}
.ar-d em{font-style:normal;font-size:13px;color:var(--verde)}
.ar-t.r .ar-d b{color:var(--rojo)}
.ar-t.m .ar-d b{color:var(--oro)}
@media(max-width:520px){ .ar-cab{gap:13px} .ar-cab .btn{margin-left:0;width:100%;margin-top:7px} }
/* ── Revisión de invoices ── */
.rev-sw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 4px}
.rev-sw button{background:var(--sup);border:1.5px solid var(--linea);border-radius:10px;
  padding:16px 10px;font-family:var(--disp);font-size:17px;text-transform:uppercase;
  color:var(--gris);cursor:pointer;transition:all .13s}
.rev-sw button:hover{border-color:var(--azul-b);color:var(--tinta)}
.rev-sw button.on.ok{background:var(--verde);border-color:var(--verde);color:#042415}
.rev-sw button.on.mal{background:var(--rojo);border-color:var(--rojo);color:#fff}
.cp-b.cor{background:var(--rojo);color:#fff}
.cp-nota{background:var(--rojo-l);border-left:3px solid var(--rojo);border-radius:6px;
  padding:8px 11px;margin-top:8px;font-size:13.5px;line-height:1.4}
.qb-a{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.btn.mini.bor{color:var(--rojo);border:1px solid var(--rojo);background:transparent;box-shadow:none}
.btn.mini.bor:hover{background:var(--rojo);color:#fff}
/* ══ Portada del cliente · fondo oscuro, no blanco ══ */
.clientebox{background:linear-gradient(168deg,#101827 0%,#0B111C 55%,#0A0E15 100%)!important;
  border:1px solid #1E2838!important;box-shadow:0 18px 50px rgba(0,0,0,.34)}
.clientebox .cb-tag{background:transparent!important;color:var(--oro)!important;
  border-bottom:1px solid #1E2838;letter-spacing:.2em}
.clientebox .cb-globo{background:#18202E!important;border-color:#2A3546!important;color:#E8EDF5!important}
.clientebox .cb-globo b{color:#fff!important}
.clientebox .cb-globo span{color:#9FB0C7!important}
.clientebox .cb-globo::before,.clientebox .cb-globo::after{border-right-color:#2A3546!important}

/* El botón principal, solo y grande */
.cb-btn.solo{width:100%;background:linear-gradient(135deg,#E0B34E 0%,#C8922F 100%)!important;
  border:0!important;border-radius:14px;padding:24px 26px;position:relative;cursor:pointer;
  text-align:left;box-shadow:0 8px 26px rgba(224,179,78,.30);margin-bottom:18px;
  transition:transform .13s, box-shadow .18s}
.cb-btn.solo:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(224,179,78,.42)}
.cb-btn.solo:active{transform:translateY(0) scale(.99)}
.cb-btn.solo .t{font-family:var(--disp);font-size:31px;line-height:1;color:#1A1206;
  text-transform:uppercase;letter-spacing:.01em}
.cb-btn.solo .s{font-size:13.5px;color:#4A360F;margin-top:5px;max-width:82%}
.cb-btn.solo .fl{position:absolute;right:24px;top:50%;transform:translateY(-50%);
  font-size:34px;color:#1A1206;opacity:.6}

/* Lo que hacemos */
.cb-serv{border-top:1px solid #1E2838;padding-top:16px;margin-bottom:16px}
.cb-st{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--oro);
  text-align:center;margin-bottom:13px}
.cb-sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cb-si{background:rgba(255,255,255,.035);border:1px solid #1E2838;border-left:2px solid var(--oro);
  border-radius:8px;padding:10px 12px;transition:background .15s,border-color .15s}
.cb-si:hover{background:rgba(224,179,78,.09);border-left-color:#fff}
.cb-si b{display:block;font-family:var(--disp);font-size:15.5px;line-height:1.12;
  color:#F2F5FA;text-transform:uppercase;letter-spacing:.01em}
.cb-si span{display:block;font-size:11px;color:#8B9BB4;margin-top:2px;line-height:1.3}
.cb-sp{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:#6C7B92;margin-top:12px}
@media(max-width:520px){ .cb-sg{grid-template-columns:1fr} .cb-btn.solo .t{font-size:26px} }
/* ══ Interacción · que todo botón se sienta al tocarlo ══ */
button{-webkit-tap-highlight-color:transparent}
.btn,.cp-b,.est-sw button,.hm-kpi button,.hm-it,.sx-cuadro,.mos,.hm-ir button{
  transition:transform .11s cubic-bezier(.2,.8,.3,1), box-shadow .16s, border-color .16s, background .16s}
.btn:active,.cp-b:active,.est-sw button:active,.hm-kpi button:active,
.hm-it:active,.sx-cuadro:active,.mos:active,.hm-ir button:active{transform:scale(.975)}
.fila{transition:background .14s, transform .11s}
.fila:hover{background:var(--sup2)}
.fila:active{transform:scale(.995)}
button:focus-visible,a:focus-visible{outline:2px solid var(--azul);outline-offset:2px;border-radius:6px}

/* ══ HOME · tablero del día ══ */
.hm-top{display:flex;justify-content:space-between;align-items:flex-start;
  gap:14px;margin-bottom:15px}
.hm-sal{font-family:var(--mono);font-size:10px;letter-spacing:.15em;color:var(--gris)}
.hm-nom{font-family:var(--disp);font-size:30px;line-height:1.05;margin-top:2px}
.hm-fec{text-align:right;flex-shrink:0}
.hm-fec b{display:block;font-family:var(--disp);font-size:31px;line-height:1;
  font-variant-numeric:tabular-nums}
.hm-fec span{font-size:11.5px;color:var(--gris);text-transform:capitalize}

.hm-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.hm-kpi button{background:var(--sup);border:1px solid var(--linea);border-top:3px solid var(--linea);
  border-radius:11px;padding:14px 10px 12px;cursor:pointer;text-align:left}
.hm-kpi button:hover{border-color:var(--azul-b);box-shadow:0 4px 16px rgba(27,86,211,.10)}
.hm-kpi b{display:block;font-family:var(--disp);font-size:30px;line-height:1;color:var(--tinta)}
.hm-kpi span{font-family:var(--mono);font-size:9px;letter-spacing:.11em;color:var(--gris)}
.hm-kpi .al{border-top-color:var(--rojo)} .hm-kpi .al b{color:var(--rojo)}
.hm-kpi .az{border-top-color:var(--azul)} .hm-kpi .az b{color:var(--azul)}
.hm-kpi .off{opacity:.5}

.hm-ag{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.hm-ags{flex:0 0 auto;min-width:172px;background:var(--sup);border:1px solid var(--linea);
  border-left:3px solid var(--azul);border-radius:10px;padding:10px 13px;text-align:left;cursor:pointer}
.hm-ags b{display:block;font-family:var(--mono);font-size:15px;color:var(--azul)}
.hm-ags span{display:block;font-family:var(--disp);font-size:16px;line-height:1.1;margin-top:2px}
.hm-ags em{font-style:normal;font-size:11px;color:var(--gris)}

.hm-lista{display:flex;flex-direction:column;gap:7px}
.hm-it{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:var(--sup);border:1px solid var(--linea);border-left:4px solid var(--gris);
  border-radius:10px;padding:12px 14px}
.hm-it:hover{box-shadow:0 3px 14px rgba(0,0,0,.08)}
.hm-it.r{border-left-color:var(--rojo)} .hm-it.am{border-left-color:var(--oro)}
.hm-it.m{border-left-color:var(--oro)}
.hm-d{font-family:var(--disp);font-size:23px;width:48px;flex:0 0 48px;color:var(--rojo)}
.hm-it.am .hm-d,.hm-it.m .hm-d{color:var(--oro)}
.hm-tx{flex:1;min-width:0}
.hm-tx b{display:block;font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-tx em{font-style:normal;font-size:12px;color:var(--gris)}
.hm-ac{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--azul);
  border:1px solid var(--azul);padding:5px 11px;border-radius:5px;flex-shrink:0}

.hm-rev{width:100%;text-align:left;background:var(--azul-l);border:1px solid var(--azul-b);
  border-radius:10px;padding:13px 15px;cursor:pointer;font-size:15px}
.hm-rev b{font-family:var(--disp);font-size:21px;margin-right:5px;color:var(--azul)}

.hm-ir{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hm-ir button{display:flex;flex-direction:column;align-items:center;gap:7px;
  background:var(--sup);border:1px solid var(--linea);border-radius:11px;
  padding:15px 8px;cursor:pointer;font-size:12.5px;color:var(--tinta);text-align:center}
.hm-ir button:hover{border-color:var(--azul);color:var(--azul)}
.hm-ir span{display:flex;width:23px;height:23px;opacity:.62}
.hm-ir svg{width:100%;height:100%}
@media(max-width:560px){
  .hm-kpi,.hm-ir{grid-template-columns:repeat(2,1fr)}
  .hm-nom{font-size:25px} .hm-fec b{font-size:26px}
}
/* ── Ficha técnica del trabajo ── */
.fic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px;margin:4px 0}
.fic{background:var(--sup2);border:1px solid var(--linea);border-left:3px solid var(--gris);
  border-radius:9px;padding:10px 12px}
.fic.az{border-left-color:var(--azul)}
.fic.ro{border-left-color:var(--rojo)}
.fic.am{border-left-color:var(--oro)}
.fic span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  color:var(--gris);margin-bottom:3px}
.fic b{font-family:var(--disp);font-size:19px;line-height:1.1;text-transform:uppercase;
  letter-spacing:.01em;display:block}
.fic.ro b{color:var(--rojo)} .fic.am b{color:var(--oro)} .fic.az b{color:var(--azul)}
@media(max-width:520px){ .fic-grid{grid-template-columns:repeat(2,1fr)} .fic b{font-size:17px} }
/* Botones más grandes y con más respuesta al tacto */
.btn{min-height:50px;padding:14px 22px}
.btn.sm{min-height:44px;padding:11px 18px;font-size:15.5px}
.btn.mini{min-height:34px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px) scale(.985)}
.btn.wide{min-height:56px;font-size:19px}
.est-sw button{min-height:48px}
/* ── Cambiar estatus del job de un toque ── */
.est-sw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 6px}
.est-sw button{background:var(--sup);border:1px solid var(--linea);border-radius:8px;
  padding:11px 6px;font-family:var(--disp);font-size:14.5px;text-transform:uppercase;
  letter-spacing:.02em;color:var(--gris);cursor:pointer;transition:all .12s}
.est-sw button:hover{border-color:var(--azul-b);color:var(--tinta)}
.est-sw button.on{color:#fff;border-color:transparent}
.est-sw button.on.activo{background:var(--oro);color:#1A1206}
.est-sw button.on.pausado{background:var(--gris)}
.est-sw button.on.terminado{background:var(--azul)}
.est-sw button.on.facturado{background:var(--verde);color:#042415}
@media(max-width:520px){ .est-sw{grid-template-columns:repeat(2,1fr)} }
/* ── Tablero del día · Carpet ── */
.cp-hoy{background:var(--sup);border:1px solid var(--linea);border-left:5px solid var(--azul);
  border-radius:12px;padding:15px 18px;margin-bottom:16px}
.cp-fecha{font-family:var(--disp);font-size:22px;text-transform:capitalize;line-height:1.1}
.cp-nums{display:flex;gap:26px;margin-top:10px}
.cp-nums b{display:block;font-family:var(--disp);font-size:29px;line-height:1}
.cp-nums span{font-family:var(--mono);font-size:10px;letter-spacing:.11em;color:var(--gris)}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;margin-bottom:8px}
.cp-card{background:var(--sup);border:1px solid var(--linea);border-left:5px solid var(--gris);
  border-radius:12px;padding:14px 16px 16px;display:flex;flex-direction:column}
.cp-card.r{border-left-color:var(--rojo)}
.cp-card.m{border-left-color:var(--oro)}
.cp-card.v{border-left-color:var(--verde)}
.cp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.cp-h{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--azul)}
.cp-est{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:3px 9px;
  border-radius:4px;border:1px solid;margin-left:auto}
.cp-est.r{color:var(--rojo);border-color:var(--rojo);background:var(--rojo-l)}
.cp-est.m{color:var(--oro);border-color:var(--oro)}
.cp-est.v{color:var(--verde);border-color:var(--verde)}
.cp-nom{font-family:var(--disp);font-size:23px;line-height:1.08;text-transform:uppercase}
.cp-sub{font-size:15px;color:var(--tinta);margin-top:3px}
.cp-pie{font-family:var(--mono);font-size:10.5px;color:var(--gris);margin-top:5px;flex:1}
.cp-b{display:block;width:100%;margin-top:13px;padding:15px;border:0;border-radius:9px;
  font-family:var(--disp);font-size:19px;text-transform:uppercase;letter-spacing:.02em;
  color:#fff;cursor:pointer;transition:transform .1s}
.cp-b:active{transform:translateY(1px)}
.cp-b.rep{background:var(--oro);color:#1A1206}
.cp-b.fac{background:var(--verde);color:#042415}
.cp-b.ver{background:transparent;color:var(--gris);border:1px solid var(--linea)}
.cp-b.esp{background:var(--sup2);color:var(--gris);cursor:default}
@media(max-width:520px){ .cp-grid{grid-template-columns:1fr} .cp-nums{gap:18px} }
/* Versión visible: si subes un archivo y este número no cambia, no subió. */
.vbadge{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:4px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:#fff;opacity:.9}
/* ── Invoices estilo QuickBooks ── */

.qb-n{font-family:var(--mono);font-size:13.5px;font-weight:600}

.qb-m{font-family:var(--mono);font-size:15px;font-weight:600;text-align:right}

.acc .ac-t{flex:1;font-family:var(--disp);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.01em}
.acc .ac-fl{font-size:16px;color:var(--gris);transition:transform .2s}
.acc[open] .ac-fl{transform:rotate(180deg)}
.acc .ac-b{padding:0 12px 12px}
.acc .ac-b .fila{margin-bottom:8px}
.acc .ac-b .fila .btn{flex-shrink:0;width:42px;padding:8px 0;font-size:19px;line-height:1}
.acc .ac-b .fila:last-child{margin-bottom:0}
.etapas{position:relative;padding-left:6px}
.etapa{display:flex;gap:14px;align-items:flex-start;position:relative;padding:10px 12px 18px 0;border-radius:10px;
  transition:background .15s}
.etapa .mano:hover{opacity:.75}
.etapa:hover{background:var(--sup)}
.etapa:last-child{padding-bottom:0}
.etapa::before{content:'';position:absolute;left:17px;top:46px;bottom:0;width:2px;background:var(--linea)}
.etapa:last-child::before{display:none}
.etapa.done::before{background:var(--azul)}
.etapa .bolita{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-family:var(--mono);font-size:15px;font-weight:600;position:relative;z-index:1;
  background:var(--sup);border:2px solid var(--linea);color:var(--gris);transition:all .15s}
.etapa.done .bolita{background:var(--azul);border-color:var(--azul);color:#fff}
.etapa.hoy .bolita{border-color:var(--ambar);color:var(--ambar-d);box-shadow:0 0 0 4px var(--ambar-l)}
.etapa .txt{flex:1;min-width:0;padding-top:2px}
.etapa .txt b{display:block;font-family:var(--disp);font-size:22px;text-transform:uppercase;line-height:1.1}
.etapa.done .txt b{color:var(--azul-d)}
.etapa .txt span{font-size:15.5px;color:var(--gris)}
.etapa .mano{cursor:pointer}
.etapa .auto{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--gris);
  border:1px solid var(--linea);border-radius:4px;padding:2px 6px;align-self:center}
.barra{height:10px;background:var(--linea2);border-radius:5px;overflow:hidden;margin-top:10px}
.barra i{transition:width .4s ease}
.barra i{display:block;height:100%;background:var(--azul)}
.fila{display:flex;gap:12px;align-items:center;background:var(--sup);border:1px solid var(--linea);border-left:4px solid var(--linea);
  border-radius:0 10px 10px 0;padding:14px 15px;margin-bottom:9px;cursor:pointer;
  box-shadow:0 1px 2px rgba(11,13,17,.04);transition:box-shadow .15s,transform .15s}
.fila:hover{box-shadow:0 3px 10px rgba(11,13,17,.09)}
.fila:active{transform:translateY(1px)}
.fila.r{border-left-color:var(--rojo)} .fila.m{border-left-color:var(--ambar)} .fila.a{border-left-color:var(--azul)}
.fila .t{flex:1;min-width:0}
.fila .t b{display:block;font-family:var(--disp);font-size:22px;font-weight:700;text-transform:uppercase}
.rapidas{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.rap{display:flex;align-items:center;gap:12px;background:var(--sup);border:1px solid var(--linea);
  border-radius:12px;padding:13px 15px}
.rap-t{flex:1;font-size:17px;font-weight:500}
.rap-b{display:flex;gap:6px;flex-shrink:0}
.rap-b button{width:64px;padding:11px 0;border-radius:9px;border:1.5px solid var(--linea);
  background:var(--sup2);color:var(--gris);font-family:var(--disp);font-size:17px;cursor:pointer}
.rap-b button.si{background:linear-gradient(180deg,#E2B85A,#C9962B);border-color:#C9962B;color:#0B0D11}
.rap-b button.no{background:var(--sup2);border-color:var(--gris);color:var(--tinta)}
.bi{display:block;font-family:var(--body);font-size:11.5px;font-weight:400;letter-spacing:.02em;
  text-transform:none;color:var(--gris);margin-top:1px;line-height:1.2}
.side button .bi{color:#6B7280}
.side button.on .bi{color:rgba(255,255,255,.65)}
/* Pestañas de área */
.areatabs{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px}
.areatabs button{background:var(--sup);border:1px solid var(--linea);border-top:3px solid var(--linea);
  border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;color:var(--gris);transition:all .16s}
.areatabs button:hover{background:var(--sup2)}
.areatabs button .a-t{display:block;font-family:var(--disp);font-weight:800;font-size:23px;
  text-transform:uppercase;line-height:1.02;letter-spacing:.01em}
.areatabs button .a-s{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;margin-top:3px;opacity:.8}
.areatabs button.on{color:var(--tinta);background:var(--sup2)}
.areatabs button.on.rest{border-top-color:var(--rojo);box-shadow:inset 0 -2px 0 var(--rojo)}
.areatabs button.on.rest .a-t{color:var(--rojo-d)}
.areatabs button.on.carp{border-top-color:#2E9E7E;box-shadow:inset 0 -2px 0 #2E9E7E}
.areatabs button.on.carp .a-t{color:#5FD3B2}
@media(max-width:520px){
  .areatabs button{padding:12px 13px}
  .areatabs button .a-t{font-size:19px}
  .areatabs button .a-s{font-size:10px}
}

/* Secciones plegables del trabajo */
.secc{background:var(--sup);border:1px solid var(--linea);border-left:4px solid var(--linea);
  border-radius:0 13px 13px 0;margin-bottom:11px;overflow:hidden}
.secc[open]{border-left-color:var(--oro)}
.secc > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:13px;
  padding:16px 18px;user-select:none;transition:background .15s}
.secc > summary::-webkit-details-marker{display:none}
.secc > summary:hover{background:var(--sup2)}
.secc .s-ic{flex-shrink:0;opacity:.5}
.secc .s-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.secc .s-t{flex:1;font-family:var(--disp);font-weight:700;font-size:22px;text-transform:uppercase;
  letter-spacing:.01em;line-height:1.05}
.secc .s-r{font-family:var(--mono);font-size:13px;color:var(--gris);white-space:nowrap}
.secc .s-fl{color:var(--gris);font-size:15px;transition:transform .2s;flex-shrink:0}
.secc[open] .s-fl{transform:rotate(180deg)}
.secc .s-b{padding:2px 18px 18px}
.secc .s-b .eyebrow:first-child{margin-top:6px}
.secc.urg{border-left-color:var(--rojo)}
.secc.urg .s-t{color:var(--rojo-d)}
.secc.ok{border-left-color:var(--verde,var(--azul))}
@media(max-width:560px){
  .secc > summary{padding:14px 15px;gap:10px}
  .secc .s-t{font-size:19px}
  .secc .s-b{padding:2px 15px 16px}
}

/* Reloj checador */
.reloj{display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(150deg,#182234 0%,#0E1523 70%);border:1px solid #1E293C;
  border-left:5px solid var(--gris);border-radius:0 14px 14px 0;padding:18px 20px;margin-bottom:14px;
  box-shadow:0 8px 26px rgba(0,0,0,.32)}
.reloj.on{border-left-color:var(--verde,var(--azul))}
.reloj.fin{border-left-color:var(--oro)}
.rj-l{flex:1;min-width:190px}
.rj-est{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#8494AD}
.rj-h{font-family:var(--disp);font-weight:800;font-size:42px;line-height:1;color:#fff;margin-top:2px}
.reloj.on .rj-h{color:#8FE9BC}
.rj-d{font-size:15px;color:#C3D6F7;margin-top:4px}
.rj-g{font-family:var(--mono);font-size:12.5px;color:#8494AD;margin-top:5px}
.rj-r{flex:0 0 200px;min-width:170px}
@media(max-width:560px){.rj-r{flex:1 1 100%}}

/* Tarjeta de reporte con fecha grande */
.repcard{background:var(--sup);border:1px solid var(--linea);border-left:5px solid var(--verde,var(--azul));
  border-radius:0 14px 14px 0;margin-bottom:13px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.repcard.inicial{border-left-color:var(--rojo)}
.repcard.nofue{border-left-color:var(--oro)}
.rc-head{display:flex;align-items:center;gap:15px;padding:14px 17px;background:var(--sup2);
  border-bottom:1px solid var(--linea)}
.rc-fecha{flex-shrink:0;text-align:center;background:var(--sup);border:1px solid var(--linea);
  border-radius:11px;padding:8px 12px;min-width:66px}
.rc-fecha .d{display:block;font-family:var(--disp);font-weight:800;font-size:31px;line-height:.92;color:var(--tinta)}
.rc-fecha .m{display:block;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;color:var(--oro);margin-top:2px}
.rc-fecha .w{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--gris);margin-top:1px}
.rc-info{flex:1;min-width:0}
.rc-tipo{font-family:var(--disp);font-weight:700;font-size:22px;line-height:1.05;text-transform:uppercase}
.rc-meta{font-family:var(--mono);font-size:12.5px;color:var(--gris);margin-top:3px}
.rc-est{flex-shrink:0}
.rc-body{padding:14px 17px}
.rc-body .meta{margin-top:6px}
.rc-pie{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 17px;
  background:var(--sup2);border-top:1px solid var(--linea)}
@media(max-width:560px){
  .rc-head{gap:11px;padding:12px 14px}
  .rc-fecha{min-width:56px;padding:7px 9px}
  .rc-fecha .d{font-size:26px}
  .rc-tipo{font-size:18px}
  .rc-body,.rc-pie{padding:12px 14px}
}

/* Notas y comentarios */
.notacard{background:var(--sup);border:1px solid var(--linea);border-left:4px solid var(--gris);
  border-radius:0 12px 12px 0;padding:14px 16px;margin-bottom:10px}
.notacard.mia{border-left-color:var(--oro)}
.nc-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.nc-autor{font-family:var(--disp);font-weight:700;font-size:18px;text-transform:uppercase}
.nc-fecha{font-family:var(--mono);font-size:12px;color:var(--gris);white-space:nowrap}
.nc-pie{display:flex;gap:7px;margin-top:10px}

/* Pulso del día */
.pulso{display:grid;grid-template-columns:1fr;gap:11px;margin-bottom:6px}
@media(min-width:700px){.pulso{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.pulso{grid-template-columns:repeat(3,1fr)}}
.pz{background:var(--sup);border:1px solid var(--linea);border-left:4px solid var(--linea);
  border-radius:0 12px 12px 0;padding:15px 16px;cursor:pointer;position:relative;overflow:hidden;
  animation:entra .34s ease-out both;transition:transform .16s,box-shadow .16s,background .16s}
.pz:hover{transform:translateY(-2px);background:var(--sup2);box-shadow:0 8px 22px rgba(0,0,0,.2)}
.pz.r{border-left-color:var(--rojo)} .pz.m{border-left-color:var(--oro)} .pz.a{border-left-color:var(--verde,var(--azul))}
.pz-ic{position:absolute;right:12px;top:12px;opacity:.13}
.pz-ic svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:1.6}
.pz-t{font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.06;text-transform:uppercase;padding-right:36px}
.pz-s{font-size:14.5px;color:var(--gris);margin-top:4px;line-height:1.35}

/* Aviso flotante */
.avisoflot{position:fixed;right:18px;bottom:22px;z-index:120;max-width:370px;display:flex;gap:12px;
  align-items:flex-start;background:var(--sup);border:1px solid var(--linea);border-left:4px solid var(--oro);
  border-radius:0 14px 14px 0;padding:15px 16px;cursor:pointer;
  box-shadow:0 12px 34px rgba(0,0,0,.42);transform:translateX(120%);opacity:0;transition:all .35s cubic-bezier(.2,.9,.3,1)}
.avisoflot.on{transform:translateX(0);opacity:1}
.avisoflot:hover{border-left-color:var(--rojo)}
.af-ic svg{width:24px;height:24px;stroke:var(--oro);fill:none;stroke-width:1.8}
.af-t{flex:1;min-width:0}
.af-t b{display:block;font-family:var(--disp);font-size:19px;text-transform:uppercase;line-height:1.05}
.af-t span{display:block;font-size:14px;color:var(--gris);margin-top:3px}
.af-x{background:none;border:0;color:var(--gris);font-size:16px;cursor:pointer;padding:0 2px;line-height:1}
@media(max-width:640px){.avisoflot{right:10px;left:10px;bottom:80px;max-width:none}}
@keyframes sacudir{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(12deg)}45%{transform:rotate(-9deg)}60%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}
.campana.sacude{animation:sacudir .8s ease-in-out 2}

/* Números que suben al aparecer */
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.kpi,.mos,.jobcard,.acc{animation:entra .34s ease-out both}
.kpi:nth-child(2),.mos:nth-child(2){animation-delay:.05s}
.kpi:nth-child(3),.mos:nth-child(3){animation-delay:.1s}
.kpi:nth-child(4),.mos:nth-child(4){animation-delay:.15s}
.mos:nth-child(5){animation-delay:.2s}
.mos:nth-child(6){animation-delay:.25s}
.barra i{transition:width .7s cubic-bezier(.2,.9,.3,1)}

/* Mosaico de navegación */
.mosaico{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.mosaico{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.mosaico{grid-template-columns:repeat(3,1fr)}}
.mosaico.ancho{grid-template-columns:1fr}
@media(min-width:900px){.mosaico.ancho{grid-template-columns:repeat(2,1fr)}}
.mos{display:block;width:100%;text-align:left;background:var(--sup);border:1px solid var(--linea);
  border-left:5px solid var(--linea);border-radius:0 14px 14px 0;padding:17px 18px;cursor:pointer;
  color:var(--tinta);box-shadow:0 2px 6px rgba(0,0,0,.10);transition:transform .16s,box-shadow .16s,background .16s;
  position:relative;overflow:hidden}
.mos:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.22);background:var(--sup2)}
.mos.plano{cursor:default}
.mos.plano:hover{transform:none;box-shadow:0 2px 6px rgba(0,0,0,.10);background:var(--sup)}
.mos.r{border-left-color:var(--rojo)}
.mos.m{border-left-color:var(--oro)}
.mos.a{border-left-color:var(--verde,var(--azul))}
.mos-ic{position:absolute;right:14px;top:14px;opacity:.16}
.mos-ic svg{width:44px;height:44px;stroke:currentColor;fill:none;stroke-width:1.6}
.mos-t{font-family:var(--disp);font-weight:800;font-size:25px;line-height:1.04;text-transform:uppercase;
  letter-spacing:.005em;padding-right:44px}
.mos-s{font-size:15px;color:var(--gris);margin-top:4px;line-height:1.35}
.mos-b{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}

/* Mascotas repartidas por la app */
.masc-cara{background:var(--masc-cara) center/contain no-repeat;flex-shrink:0}
.masc-busto{background:var(--masc-busto) center/contain no-repeat;flex-shrink:0}
.masc-full{background:var(--mascota) center bottom/contain no-repeat;flex-shrink:0}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes asoma{0%{transform:translateY(24px);opacity:0}60%{transform:translateY(-4px);opacity:1}100%{transform:translateY(0);opacity:1}}
@keyframes tim{0%,92%,100%{transform:rotate(0)}94%{transform:rotate(-9deg)}96%{transform:rotate(8deg)}98%{transform:rotate(-5deg)}}

/* la cara asomándose arriba de la caja del staff */
.staff-masc{position:absolute;right:16px;top:-30px;width:76px;height:74px;z-index:3;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));animation:asoma .7s ease-out both}
.staffbox{position:relative}
/* la cara junto al bloque de emergencia */
.emerg{position:relative}
.emerg-masc{position:absolute;left:12px;bottom:8px;width:58px;height:56px;opacity:.9;
  animation:tim 5s ease-in-out infinite;transform-origin:50% 80%}
@media(max-width:520px){.emerg-masc{display:none}}
/* saludo del panel de bienvenida */
.hero-masc{position:absolute;right:18px;bottom:-6px;width:112px;height:108px;opacity:.95;z-index:1;
  animation:flota 5s ease-in-out infinite;pointer-events:none}
@media(max-width:760px){.hero-masc{width:84px;height:80px;right:8px;opacity:.75}}
/* vacíos con mascota */
.empty .masc-vacio{width:130px;height:126px;margin:0 auto 12px;opacity:.85;animation:flota 5s ease-in-out infinite}

/* Portada: una columna en celular, dos lado a lado en pantalla ancha */
.staffbox{border-radius:14px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.45)}
@media(min-width:920px){
  .login{max-width:none!important;width:100%!important;display:grid;
    grid-template-columns:minmax(330px,390px) minmax(360px,440px);
    gap:28px;align-items:start;justify-content:center}
  .clientebox{margin-top:0!important}
  .login-page{padding:34px 22px;align-items:flex-start}
  .pie{grid-column:1 / -1;margin-top:22px}
}
@media(min-width:1280px){
  .login{grid-template-columns:minmax(350px,410px) minmax(390px,480px);gap:36px}
}
/* Bloque del cliente en la portada */
.clientebox{background:#FFFDF7;border:1px solid #E8DCBA;border-radius:16px;margin-top:16px;
  overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.28);position:relative}
.cb-tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:#8A7742;
  background:#F6EAC9;padding:9px 18px;border-bottom:1px solid #E8DCBA;text-transform:uppercase}
.clientebox .cbtop{display:flex;align-items:flex-end;gap:6px;padding:16px 16px 0;position:relative;min-height:150px}
.cb-masc{width:118px;height:158px;background:var(--mascota) center bottom/contain no-repeat;flex-shrink:0;
  animation:saluda 4.5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes saluda{0%,88%,100%{transform:translateY(0) rotate(0)}92%{transform:translateY(-5px) rotate(-2deg)}96%{transform:translateY(-2px) rotate(1.5deg)}}
.cb-globo{flex:1;background:#fff;border:2px solid #0B0D11;border-radius:16px;padding:13px 15px;margin-bottom:34px;
  position:relative;box-shadow:0 3px 0 rgba(11,13,17,.18)}
.cb-globo::after{content:'';position:absolute;left:-11px;bottom:15px;width:0;height:0;
  border:10px solid transparent;border-right-color:#0B0D11;border-left:0}
.cb-globo::before{content:'';position:absolute;left:-7px;bottom:16px;width:0;height:0;z-index:1;
  border:9px solid transparent;border-right-color:#fff;border-left:0}
.cb-globo b{display:block;font-family:var(--disp);font-weight:800;font-size:23px;line-height:1.02;color:#0B0D11;text-transform:uppercase}
.cb-globo span{display:block;font-size:14.5px;color:#5B6472;margin-top:3px}
.cb-cuerpo{padding:4px 16px 18px}
.cb-btn{display:block;width:100%;text-align:left;background:linear-gradient(135deg,#E2B85A,#C9962B);
  border:0;border-radius:12px;padding:16px 18px;cursor:pointer;color:#0B0D11;position:relative;
  box-shadow:0 5px 18px rgba(201,150,43,.34)}
.cb-btn:hover{filter:brightness(1.07)}
.cb-btn:active{transform:translateY(1px)}
.cb-btn .t{font-family:var(--disp);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.cb-btn .s{font-size:14.5px;opacity:.82;margin-top:2px}
.cb-btn .fl{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:30px;opacity:.5}
.emerg{background:#0B0D11;border-radius:12px;padding:14px 16px;margin-top:12px;text-align:center}
.emerg .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:#FF8A8A}
.emerg .tel{font-family:var(--disp);font-weight:800;font-size:29px;color:#fff;letter-spacing:.01em;
  display:block;text-decoration:none;margin-top:2px}
.emerg .tel:hover{color:#E0B34E}
.emerg .mail{font-size:14px;color:#9AA9C0;text-decoration:none;display:block;margin-top:6px;word-break:break-all}
.emerg .mail:hover{color:#E0B34E}
.grupo-et{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:#8A93A0;
  text-transform:uppercase;margin:16px 0 9px;display:flex;align-items:center;gap:10px}
.grupo-et:first-of-type{margin-top:4px}
.grupo-et::after{content:'';flex:1;height:1px;background:#E4E8EC}
.idio-btn{width:100%;margin-top:11px;background:none;border:1px solid var(--linea);color:var(--gris);
  border-radius:10px;padding:11px;font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;transition:all .15s}

async function sha256(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// Todo aviso nace marcado con su departamento, para que cada quien vea solo los suyos.
async function notifIns(p){
  const arr = Array.isArray(p) ? p : [p];
  for(const n of arr){
    if(n.departamento) continue;
    if(n.job_id){
      try{
        const {data:jj}=await sb.from('jobs').select('departamento').eq('id',n.job_id).maybeSingle();
        if(jj && jj.departamento) n.departamento=jj.departamento;
      }catch(err){}
    }
    if(!n.departamento)
      n.departamento = (U && U.departamento && U.departamento!=='ambos')
        ? U.departamento : (DEP || 'restoration');
  }
  return sb.from('notificaciones').insert(arr);
}

let NOTIF=0;

async function avisarTecnicos(){
  const h=hoy();
  if(new Date().getHours() < HORA_AVISO) return;
  const {data:tecs}=await sb.from('usuarios').select('id,nombre,departamento').eq('rol','tecnico').eq('activo',true);
  if(!tecs||!tecs.length) return;
  const {data:jobs}=await sb.from('jobs')
    .select('id,departamento,fecha_inicio,created_at').not('estatus','in','("terminado","facturado")');
  const J=jobs||[];
  if(!J.length) return;
  const {data:reps}=await sb.from('reportes').select('job_id,fecha').in('job_id',J.map(x=>x.id)).gte('fecha',hace(30));
  const porJob={}; (reps||[]).forEach(r=>(porJob[r.job_id] ||= new Set()).add(r.fecha));
  for(const t of tecs){
    const suyos = J.filter(x=>t.departamento==='ambos' || x.departamento===t.departamento);
    let total=0, jobsCon=0;
    suyos.forEach(j=>{ const f=diasFaltantes(j, porJob[j.id]||new Set()); if(f.length){ total+=f.length; jobsCon++; } });
    if(!total) continue;
    await notifIns({
      tipo:'recordatorio', clave:'rec-'+t.id+'-'+h,
      titulo:'You owe '+total+' report'+(total===1?'':'s'),
      texto:jobsCon+' job'+(jobsCon===1?'':'s')+' waiting for your report. Open the app and close them, or mark why you did not go.',
      para_rol:'tecnico', para_usuario:t.id});
  }
}

async function revisarFaltantes(){
  if(!U || U.rol==='tecnico') return [];
  avisarTecnicos();
  const h=hoy(), ayer=hace(1);
  const {data:jobs}=await sb.from('jobs')
    .select('id,folio,cliente,unidad,fecha_inicio,created_at,departamento,tecnico_id, propiedades(nombre), usuarios(nombre)')
    .eq('departamento',DEPV())
    .not('estatus','in','("terminado","facturado")');
  // Segunda red: aunque la consulta ya filtra, se vuelve a filtrar aquí.
  // Si un job trae el departamento mal en la base, no se cuela igual.
  const J=(jobs||[]).filter(x=>x.departamento===DEPV());
  if(!J.length) return [];
  const ids=J.map(x=>x.id);
  const {data:reps}=await sb.from('reportes').select('job_id,fecha').in('job_id',ids).gte('fecha',hace(30));
  const porJob={}; (reps||[]).forEach(r=>(porJob[r.job_id] ||= new Set()).add(r.fecha));
  const pendientes=[];
  const limpiar=[];
  for(const j of J){
    const arranque=(j.fecha_inicio||j.created_at||h).slice(0,10);
    if(arranque>ayer) continue;
    const faltas=diasFaltantes(j, porJob[j.id]||new Set());
    const deAyer=faltas.filter(f=>f<h);
    if(!deAyer.length){ limpiar.push(j.id); continue; }
    const prop=j.propiedades?.nombre||j.cliente;
    pendientes.push({job:j, prop, dias:deAyer.length, ultimo:deAyer[deAyer.length-1]});
    // un aviso por job por día, sin repetir
    await notifIns({
      tipo:'faltante', clave:'falta-'+j.id+'-'+h,
      titulo:'Sin reporte · '+prop,
      texto:`${j.folio}${j.unidad?' · Unit '+j.unidad:''} · ${deAyer.length} día${deAyer.length===1?'':'s'} sin reportar`
        + (j.usuarios?.nombre?' · '+j.usuarios.nombre:' · sin técnico asignado'),
      job_id:j.id, para_rol:'admin'
    });
  }
  // si el job ya quedó al corriente, se apagan sus avisos viejos
  if(limpiar.length){
    await sb.from('notificaciones').update({leida:true})
      .eq('tipo','faltante').eq('leida',false).in('job_id',limpiar);
  }
  return pendientes;
}

    const d=await r.json();
    dir=(d.address?.road?d.address.road+' ':'')+(d.address?.house_number||'')+(d.address?.city?', '+d.address.city:'');
  }catch(e){} }
  const prev=await miAsistenciaC();

  if(tipo==='entrada'){
    if(prev && prev.entrada) return toast('Ya registraste tu entrada hoy.');
    const {error}=await sb.from('asistencias').upsert(
      {contratista_id:U.id, nombre:U.nombre, fecha:hoy(), entrada:ahora,
       ent_lat:g?.lat||null, ent_lng:g?.lng||null, ent_dir:dir||null},
      {onConflict:'contratista_id,fecha'});
    if(error) return toast('Error: '+error.message);
    await notifIns({tipo:'checada', clave:'centr-'+U.id+'-'+hoy(),
      titulo:'Entrada · '+U.nombre+' (contratista)',
      texto:hhmm(ahora)+(dir?' · '+dir:''), para_rol:'admin'});
    tono('normal'); toast('Entrada registrada a las '+hhmm(ahora));
  } else {
    if(!prev || !prev.entrada) return toast('Primero registra tu entrada.');
    if(prev.salida) return toast('Ya registraste tu salida hoy.');
    const {count}=await sb.from('partes_contratista').select('*',{count:'exact',head:true})
      .eq('contratista_id',U.id).eq('fecha',hoy());
    if(!count) return toast('Antes de salir, anota qué trabajo hiciste hoy.');
    const min=Math.round((new Date(ahora)-new Date(prev.entrada))/60000);
    const {error}=await sb.from('asistencias').update({salida:ahora, minutos:min,
      sal_lat:g?.lat||null, sal_lng:g?.lng||null, sal_dir:dir||null}).eq('id',prev.id);
    if(error) return toast('Error: '+error.message);
    await notifIns({tipo:'checada', clave:'csal-'+U.id+'-'+hoy(),
      titulo:'Salida · '+U.nombre+' (contratista)',
      texto:hhmm(ahora)+' · '+horasTxt(min)+(dir?' · '+dir:''), para_rol:'admin'});
    tono('normal'); toast('Salida registrada · '+horasTxt(min));
  }
  render();
}

    </div>`;
  } else {
    out += `<div class="ok" style="margin-bottom:14px">Ya registraste ${hoyPartes.length} trabajo${hoyPartes.length===1?'':'s'} de hoy.</div>`;

      <div class="tt">Anotar trabajo de hoy</div>
      <div class="ss">Qué hiciste, dónde y cuánto es</div>
      <div class="fl">›</div>
    </button>`;

      <div class="row" style="justify-content:space-between">
        <span class="folio">${esc(p.jobs?.folio||'')}</span>
        <span class="chip ${ESTAT_PART[p.estatus]?ESTAT_PART[p.estatus][1]:''}">${ESTAT_PART[p.estatus]?ESTAT_PART[p.estatus][0]:esc(p.estatus)}</span></div>
      <div class="tit">${esc(p.jobs?.propiedades?.nombre||p.jobs?.cliente||'')}${p.jobs?.unidad?' · Unit '+esc(p.jobs.unidad):''}</div>

      <div class="sub">${esc(p.detalle||'')}</div>
      <div class="row" style="margin-top:11px">
        ${p.jobs?.direccion?`<a class="btn ghost sm" target="_blank" rel="noopener"
          href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.jobs.direccion)}">Ruta</a>`:''}

      </div></div>`).join('')
    : '<div class="sub">No traes reparaciones asignadas ahorita.</div>';

  // historial
  out += `<div class="eyebrow">Mis partes de la semana · ${PT.length}</div>`;
  out += PT.length ? PT.map(x=>`<div class="fila ${x.terminado?'a':'m'}" data-vparte="${x.id}">

    </div>`).join('') : '<div class="sub">Todavía no has registrado partes esta semana.</div>';

  return out;
}

async function formParte(id, pidPre){
  let p={fecha:hoy(), descripcion:'', avance:'', terminado:false, monto:'', ayudantes:0, horas:'', materiales:'', notas:'', fotos:[], job_id:'', partida_id:''};

    .select('id,nombre,detalle,cantidad,job_id, jobs(folio,unidad,cliente, propiedades(nombre))')
    .eq('contratista_id',U.id).neq('estatus','terminada');
  const MIS=mis||[];
  if(p.partida_id && !p.job_id){ const x=MIS.find(y=>y.id===p.partida_id); if(x) p.job_id=x.job_id; }

  const pinta=()=>{
    $('#sheet').innerHTML=`<div class="sheet"><div class="sheet-head">
      <div style="min-width:0"><div class="mono" style="color:#C3D6F7">PARTE DIARIO · ${fmt(p.fecha).toUpperCase()}</div>
      <div class="disp">${id?'Editar parte':'¿Qué trabajo hiciste?'}</div>
      <div style="color:#C3D6F7">${esc(U.nombre)}</div></div>
      <button class="x" id="c1">✕</button></div>
      <div class="franja split"><i></i><i></i></div>
      <div class="sheet-body">
        <label style="margin-top:0">Fecha</label>
        <input id="p_f" type="date" value="${esc(p.fecha)}" max="${hoy()}" style="font-family:var(--mono);font-size:18px">

        <label>¿En qué trabajo?</label>
        <select id="p_pid">
          <option value="">— otro trabajo / no está en la lista —</option>
          ${MIS.map(x=>`<option value="${x.id}" ${p.partida_id===x.id?'selected':''}>
            ${esc(x.jobs?.propiedades?.nombre||x.jobs?.cliente||'')}${x.jobs?.unidad?' Unit '+esc(x.jobs.unidad):''} · ${esc(x.nombre)}</option>`).join('')}
        </select>

        <label>¿Qué hiciste? · obligatorio</label>
        <textarea id="p_desc" style="min-height:120px;font-size:17px" placeholder="Instalé drywall 2x2 en la cocina, puse texture y quedó listo para pintar.">${esc(p.descripcion||'')}</textarea>

        <label>¿Quedó terminado?</label>
        <div class="si-no" id="p_term">
          <button data-t="1" class="${p.terminado?'on':''}">Sí, terminado</button>
          <button data-t="0" class="${!p.terminado?'on':''}">Sigue en proceso</button>
        </div>
        ${!p.terminado?`<label>¿Qué falta?</label>
          <input id="p_av" value="${esc(p.avance||'')}" placeholder="Falta la segunda mano de texture">`:''}

        <div class="g2">
          <div><label>Horas trabajadas</label><input class="num" id="p_hr" value="${esc(p.horas||'')}" placeholder="6"></div>
          <div><label>Ayudantes</label><input class="num" id="p_ay" type="number" min="0" value="${p.ayudantes||0}"></div>
        </div>

        <label>¿Cuánto es este trabajo?</label>
        <input class="num" id="p_mo" type="number" step="0.01" value="${p.monto??''}" placeholder="0.00"
          style="font-family:var(--mono);font-size:24px;text-align:left">
        <div class="sub" style="margin-top:6px">Lo que vas a cobrar por lo que hiciste hoy. Oficina lo revisa antes de pagar.</div>

        <label>Materiales que pusiste</label>
        <input id="p_mat" value="${esc(p.materiales||'')}" placeholder="2 hojas de drywall, cinta y compuesto">

        <div class="eyebrow">Fotos del trabajo</div>
        <input id="p_ft" type="file" accept="image/*" multiple capture="environment">
        <div id="p_th" style="margin-top:10px"></div>

        <label>Notas para oficina</label>
        <textarea id="p_nt" placeholder="Lo que deban saber">${esc(p.notas||'')}</textarea>

        <div style="height:18px"></div>
        <button class="btn wide" id="p_sv">${id?'Guardar cambios':'Enviar parte'}</button>
        <div style="height:10px"></div><button class="btn ghost wide" id="c2">Cancelar</button>
      </div></div>`;

    $('#c1').onclick=$('#c2').onclick=()=>{cerrar();render();};
    $('#sheet').querySelectorAll('#p_term [data-t]').forEach(b=>b.onclick=()=>{
      p.terminado=b.dataset.t==='1'; leer(); pinta();
    });
    const pintaFt=()=>{
      const g=fotosPorArea(p.fotos);
      $('#p_th').innerHTML=(p.fotos||[]).length?`<div class="thumbs">${(p.fotos||[]).map(f=>
        `<div style="position:relative"><img src="${esc(fotoU(f))}">
        <button type="button" data-qf2="${esc(fotoU(f))}" style="position:absolute;top:-6px;right:-6px;width:24px;height:24px;
          border-radius:50%;border:0;background:var(--rojo);color:#fff;font-size:14px;cursor:pointer;line-height:1">×</button></div>`).join('')}</div>`:'';
      $('#p_th').querySelectorAll('[data-qf2]').forEach(b=>b.onclick=()=>{
        p.fotos=p.fotos.filter(f=>fotoU(f)!==b.dataset.qf2); pintaFt();
      });
    };
    pintaFt();
    $('#p_ft').onchange=async e=>{
      const fs=[...e.target.files]; if(!fs.length) return;
      toast('Subiendo '+fs.length+' foto(s)…');
      for(const f of fs){
        const nm=`parte/${U.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.jpg`;
        const {error}=await sb.storage.from('capri').upload(nm,f,{contentType:f.type||'image/jpeg'});
        if(error){ toast('Error: '+error.message); continue; }
        p.fotos.push({u:sb.storage.from('capri').getPublicUrl(nm).data.publicUrl, a:'Trabajo'});
      }
      pintaFt(); toast('Listo');
    };
    const leer=()=>{
      p.fecha=$('#p_f').value||hoy();
      p.partida_id=$('#p_pid').value||null;
      p.descripcion=$('#p_desc').value;
      const av=$('#p_av'); if(av) p.avance=av.value;
      p.horas=$('#p_hr').value; p.ayudantes=+$('#p_ay').value||0;
      p.monto=$('#p_mo').value; p.materiales=$('#p_mat').value; p.notas=$('#p_nt').value;
    };
    $('#p_sv').onclick=async()=>{
      leer();
      if(!p.descripcion.trim()) return toast('Escribe qué trabajo hiciste.');
      const x=MIS.find(y=>y.id===p.partida_id);
      const dat={contratista_id:U.id, fecha:p.fecha, descripcion:p.descripcion.trim(),
        partida_id:p.partida_id||null, job_id:x?x.job_id:(p.job_id||null),
        avance:p.avance||null, terminado:p.terminado,
        monto:p.monto===''?null:Number(p.monto), ayudantes:p.ayudantes,
        horas:p.horas===''?null:Number(p.horas), materiales:p.materiales||null,
        notas:p.notas||null, fotos:p.fotos};
      const {error} = id ? await sb.from('partes_contratista').update(dat).eq('id',id)
                         : await sb.from('partes_contratista').insert(dat);
      if(error) return toast('No se guardó: '+error.message);
      if(p.terminado && p.partida_id)
        await sb.from('partidas').update({estatus:'terminada', fecha_fin:p.fecha}).eq('id',p.partida_id);
      await notifIns({tipo:'parte',
        titulo:'Parte de '+U.nombre,
        texto:fmt(p.fecha)+' · '+p.descripcion.slice(0,70)+(p.monto?' · '+cf(p.monto):''),
        job_id:dat.job_id, para_rol:'admin'});
      cerrar(); toast('Parte enviado'); render();
    };
  };
  pinta();
}

/* ==================== RELOJ CHECADOR ==================== */
function hhmm(ts){
  if(!ts) return '—';
  return new Date(ts).toLocaleTimeString(ING()?'en-US':'es-MX',{hour:'2-digit',minute:'2-digit'});
}
function horasTxt(min){
  if(!min && min!==0) return '—';
  const h=Math.floor(min/60), m=min%60;
  return h+'h '+String(m).padStart(2,'0')+'m';
}

function ubicame(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res(null);
    const t=setTimeout(()=>res(null), 9000);
    navigator.geolocation.getCurrentPosition(
      p=>{ clearTimeout(t); res({lat:p.coords.latitude, lng:p.coords.longitude}); },
      ()=>{ clearTimeout(t); res(null); },
      {enableHighAccuracy:true, timeout:8000, maximumAge:60000});
  });
}

async function miAsistencia(){
  const {data}=await sb.from('asistencias').select('*').eq('usuario_id',U.id).eq('fecha',hoy()).maybeSingle();
  return data||null;
}

async function checar(tipo){
  const en=ING(), L=(es,ing)=>en?ing:es;
  toast(L('Tomando tu ubicación…','Getting your location…'));
  const g=await ubicame();
  const ahora=new Date().toISOString();
  let dir='';
  if(g){
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+g.lat+'&lon='+g.lng);
      const d=await r.json();
      dir=(d.address?.road?d.address.road+' ':'')+(d.address?.house_number||'')+(d.address?.city?', '+d.address.city:'');
    }catch(e){}
  }

  const prev=await miAsistencia();

  if(tipo==='entrada'){
    if(prev && prev.entrada) return toast(L('Ya registraste tu entrada hoy.','You already clocked in today.'));
    const p={usuario_id:U.id, nombre:U.nombre, fecha:hoy(), entrada:ahora,
      ent_lat:g?.lat||null, ent_lng:g?.lng||null, ent_dir:dir||null};
    const {error}=await sb.from('asistencias').upsert(p,{onConflict:'usuario_id,fecha'});
    if(error) return toast('Error: '+error.message);
    await notifIns({
      tipo:'checada', clave:'ent-'+U.id+'-'+hoy(),
      titulo:'Entrada · '+U.nombre,
      texto:hhmm(ahora)+(dir?' · '+dir:'')+(g?'':' · sin GPS'),
      para_rol:'admin'});
    tono('normal');
    toast(L('Entrada registrada a las ','Clocked in at ')+hhmm(ahora));
  } else {
    if(!prev || !prev.entrada) return toast(L('Primero registra tu entrada.','Clock in first.'));
    if(prev.salida) return toast(L('Ya registraste tu salida hoy.','You already clocked out today.'));
    const min=Math.round((new Date(ahora)-new Date(prev.entrada))/60000);
    const {error}=await sb.from('asistencias').update({salida:ahora, minutos:min,
      sal_lat:g?.lat||null, sal_lng:g?.lng||null, sal_dir:dir||null}).eq('id',prev.id);
    if(error) return toast('Error: '+error.message);
    await notifIns({
      tipo:'checada', clave:'sal-'+U.id+'-'+hoy(),
      titulo:'Salida · '+U.nombre,
      texto:hhmm(ahora)+' · '+horasTxt(min)+(dir?' · '+dir:''),
      para_rol:'admin'});
    tono('normal');
    toast(L('Salida registrada · ','Clocked out · ')+horasTxt(min));
  }
  render();
}

let HSEM = 0;
async function vHoras(){
  const base=new Date(hoy()+'T12:00:00');
  base.setDate(base.getDate() - base.getDay() + 1 + HSEM*7);
  const lun=iso(base);
  const finD=new Date(base); finD.setDate(finD.getDate()+6);
  const dom=iso(finD);

  const [{data:asis},{data:users}] = await Promise.all([
    sb.from('asistencias').select('*').gte('fecha',lun).lte('fecha',dom).order('fecha'),
    sb.from('usuarios').select('id,nombre,rol,puesto,tarifa_hora,activo').neq('rol','admin').order('nombre')
  ]);
  const A=asis||[], US=(users||[]).filter(x=>x.activo!==false);

  const porUser={};
  A.forEach(a=>(porUser[a.usuario_id] ||= []).push(a));

  const dias7=[]; for(let i=0;i<7;i++){ const d=new Date(base); d.setDate(d.getDate()+i); dias7.push(iso(d)); }
  const nomDia=f=>new Date(f+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short'}).toUpperCase();

  setTimeout(()=>{
    const p=$('#h_prev'), n=$('#h_next'), hy=$('#h_hoy');
    if(p) p.onclick=()=>{HSEM--;render();};
    if(n) n.onclick=()=>{HSEM++;render();};
    if(hy) hy.onclick=()=>{HSEM=0;render();};
    document.querySelectorAll('[data-edas]').forEach(b=>b.onclick=()=>editarAsistencia(b.dataset.edas));
    document.querySelectorAll('[data-newas]').forEach(b=>b.onclick=()=>editarAsistencia(null, b.dataset.newas, b.dataset.f));
    const ex=$('#h_export'); if(ex) ex.onclick=()=>exportarHoras(US, porUser, dias7, lun, dom);

  const totalMin = A.reduce((a,x)=>a+(x.minutos||0),0);
  const totalPago = US.reduce((acc,u)=>{
    const min=(porUser[u.id]||[]).reduce((a,x)=>a+(x.minutos||0),0);

  return `<div class="row no-print" style="gap:9px;margin-bottom:14px">

      <div class="kpi a"><div class="l">Semana</div>
        <div class="v" style="font-size:26px">${fmt(lun).slice(0,5)} — ${fmt(dom).slice(0,5)}</div>
        <div class="p">${HSEM===0?'semana en curso':HSEM<0?Math.abs(HSEM)+' semana(s) atrás':'próxima semana'}</div></div>
      <div class="kpi"><div class="l">Horas totales</div>
        <div class="v">${horasTxt(totalMin)}</div><div class="p">de todo el equipo</div></div>
      <div class="kpi"><div class="l">Días trabajados</div>
        <div class="v">${A.filter(x=>x.minutos).length}</div><div class="p">jornadas cerradas</div></div>
      ${VE_DINERO()?`<div class="kpi m"><div class="l">Nómina estimada</div>
        <div class="v" style="font-size:30px">${cf(totalPago)}</div>
        <div class="p">según la tarifa de cada quien</div></div>`:''}
    </div>

    ${US.map(u=>{
      const mias=porUser[u.id]||[];
      const min=mias.reduce((a,x)=>a+(x.minutos||0),0);
      const pago=(min/60)*Number(u.tarifa_hora||0);
      const abierto=mias.find(x=>x.entrada&&!x.salida);
      return `<div class="card ${abierto?'ambar':''}">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <div class="tit">${esc(u.nombre)}</div>
            <div class="meta">${esc(u.puesto||u.rol)}${u.tarifa_hora&&VE_DINERO()?' · '+cf(u.tarifa_hora)+'/hora':''}</div>
          </div>
          <div style="text-align:right">

            ${(pago&&VE_DINERO())?`<div class="meta">${cf(pago)}</div>`:''}

          </div>
        </div>
        <table class="ptab" style="margin-top:12px">
          <thead><tr><th>Día</th><th>Entrada</th><th>Salida</th><th>Horas</th><th></th></tr></thead>
          <tbody>${dias7.map(f=>{

            </tr>`;}).join('')}</tbody>
        </table>
      </div>`;}).join('') || '<div class="empty"><div class="disp">Sin personal</div><p>Da de alta a tu gente en Equipo.</p></div>'}`;
}

async function editarAsistencia(id, userId, fecha){
  let a={usuario_id:userId, fecha:fecha||hoy(), entrada:null, salida:null};
  let nom='';
  if(id){
    const {data}=await sb.from('asistencias').select('*').eq('id',id).single();
    a=data; nom=data.nombre||'';
  } else {
    const {data}=await sb.from('usuarios').select('nombre').eq('id',userId).single();
    nom=data?.nombre||'';
  }
  const hm = ts => ts ? new Date(ts).toTimeString().slice(0,5) : '';

  $('#sheet').innerHTML=`<div class="sheet"><div class="sheet-head">
    <div style="min-width:0"><div class="mono" style="color:#C3D6F7">${fmt(a.fecha).toUpperCase()}</div>
    <div class="disp">${esc(nom)}</div>
    <div style="color:#C3D6F7">Ajuste de horas</div></div>
    <button class="x" id="c1">✕</button></div>
    <div class="franja split"><i></i><i></i></div>
    <div class="sheet-body">
      <div class="g2">
        <div><label>Entrada</label><input id="a_ent" type="time" value="${hm(a.entrada)}" style="font-size:21px"></div>
        <div><label>Salida</label><input id="a_sal" type="time" value="${hm(a.salida)}" style="font-size:21px"></div>
      </div>
      <label>Nota del ajuste</label>
      <input id="a_nt" value="${esc(a.notas||'')}" placeholder="Se le olvidó checar salida, confirmó por teléfono">
      ${a.ent_dir?`<div class="card" style="margin-top:12px"><div class="meta">DONDE CHECÓ ENTRADA</div>
        <div class="sub" style="color:var(--tinta)">📍 ${esc(a.ent_dir)}</div></div>`:''}
      ${a.sal_dir?`<div class="card"><div class="meta">DONDE CHECÓ SALIDA</div>
        <div class="sub" style="color:var(--tinta)">📍 ${esc(a.sal_dir)}</div></div>`:''}
      <div style="height:18px"></div>

      <div style="height:10px"></div><button class="btn ghost wide" id="c2">Cancelar</button>
    </div></div>`;
  $('#c1').onclick=$('#c2').onclick=()=>{cerrar();render();};

    const ent=new Date(a.fecha+'T'+e+':00').toISOString();

    const min=sal?Math.round((new Date(sal)-new Date(ent))/60000):null;
    const p={usuario_id:a.usuario_id, nombre:nom, fecha:a.fecha, entrada:ent, salida:sal,
      minutos:min, notas:$('#a_nt').value.trim()||null, ajustado_por:U.nombre};
    const {error}= id ? await sb.from('asistencias').update(p).eq('id',id)
                      : await sb.from('asistencias').upsert(p,{onConflict:'usuario_id,fecha'});

  };
  const ad=$('#a_del');
  if(ad) ad.onclick=async()=>{
    if(!confirm('¿Borrar este registro de horas?')) return;
    await sb.from('asistencias').delete().eq('id',id);
    cerrar(); toast('Registro borrado'); render();
  };

function exportarHoras(US, porUser, dias7, lun, dom){
  let t='NOMBRE,PUESTO,'+dias7.map(f=>f).join(',')+',TOTAL HORAS,TARIFA,PAGO\n';
  US.forEach(u=>{
    const mias=porUser[u.id]||[];
    const min=mias.reduce((a,x)=>a+(x.minutos||0),0);
    const cols=dias7.map(f=>{ const a=mias.find(x=>x.fecha===f); return a&&a.minutos?(a.minutos/60).toFixed(2):''; });
    t+=`"${u.nombre}","${u.puesto||u.rol}",${cols.join(',')},${(min/60).toFixed(2)},${u.tarifa_hora||''},${((min/60)*Number(u.tarifa_hora||0)).toFixed(2)}\n`;
  });
  const b=new Blob([t],{type:'text/csv;charset=utf-8'});
  const a2=document.createElement('a');
  a2.href=URL.createObjectURL(b);
  a2.download='horas_'+lun+'_a_'+dom+'.csv';
  a2.click();
  toast('Archivo descargado');
}

/* ==================== PULSO DEL DÍA ==================== */
function pulsoHTML(datos){
  const {jobs, reps, parts, ests, faltantes} = datos;
  const h=hoy(), n=[];
  const J=jobs||[], P=parts||[], E=ests||[], R=reps||[];

  const act = J.filter(x=>!['terminado','facturado'].includes(x.estatus));
  const nuevosSem = J.filter(x=>inicioJob(x) >= hace(7)).length;
  const cerrSem = J.filter(x=>x.estatus==='facturado' && x.invoice_fecha && x.invoice_fecha>=hace(7)).length;
  const repHoy = R.filter(x=>x.fecha===h).length;
  const porCobrar = J.filter(x=>x.invoice_num && !x.invoice_pagado)
    .reduce((a,x)=>a+Number(x.invoice_monto||0),0);
  const viejos = act.filter(x=>dias(inicioJob(x),h) >= 14);
  const sinTec = act.filter(x=>!x.tecnico_id);
  const estViejos = E.filter(x=>x.estatus==='enviado' && x.fecha_envio && dias(x.fecha_envio,h)>=7);
  const secando = act.filter(x=>(x.docs||[]).includes('trabajando') && !(x.docs||[]).includes('seco'));

  if(nuevosSem) n.push({i:'jobs', c:'a', t:`${nuevosSem} ${nuevosSem===1?'trabajo nuevo':'trabajos nuevos'} esta semana`,
    s:'Entraron en los últimos 7 días'});
  if(cerrSem) n.push({i:'estimados', c:'a', t:`${cerrSem} ${cerrSem===1?'cerrado':'cerrados'} esta semana`,
    s:'Facturados y listos'});
  if(secando.length) n.push({i:'dia', c:'m', t:`${secando.length} en secado activo`,
    s:'Con equipo instalado, pendientes de llegar a seco'});
  if(viejos.length) n.push({i:'jobs', c:'r', t:`${viejos.length} ${viejos.length===1?'lleva':'llevan'} más de 2 semanas`,
    s:`El más viejo: ${Math.max(...viejos.map(x=>dias(inicioJob(x),h)))} días · revisa si ya se pueden cerrar`});
  if(sinTec.length) n.push({i:'equipo', c:'r', t:`${sinTec.length} sin técnico asignado`,
    s:'Nadie los está reportando'});
  if(estViejos.length) n.push({i:'estimados', c:'r', t:`${estViejos.length} ${estViejos.length===1?'estimado lleva':'estimados llevan'} más de una semana`,
    s:'Sin respuesta del management · vale la pena insistir'});
  // Facturación al día: lo que se terminó hoy o ayer y todavía no se factura
  const alDia = J.filter(x=>x.estatus==='terminado' && !x.invoice_num
                          && dias(x.fecha_cierre||inicioJob(x),h) <= 1);
  if(alDia.length) n.push({i:'cobranza', c:'r',
    t:`${alDia.length} ${alDia.length===1?'trabajo terminado sin facturar hoy':'trabajos terminados sin facturar hoy'}`,
    s:'Factúralos el mismo día · después se olvidan'});

  // Terminados que nadie ha facturado · esto es lo que se te pierde
  const sinFact = J.filter(x=>x.estatus==='terminado' && !x.invoice_num);
  const sinFactViejos = sinFact.filter(x=>dias(x.fecha_cierre||inicioJob(x),h) >= 7);
  // Facturados que ya se pasaron de 30 días sin pagar
  const vencidas = J.filter(x=>x.invoice_num && !x.invoice_pagado && x.invoice_fecha
                              && dias(x.invoice_fecha,h) >= 30);

  if(sinFact.length) n.push({i:'cobranza', c:'r',
    t:`${sinFact.length} ${sinFact.length===1?'trabajo terminado sin facturar':'trabajos terminados sin facturar'}`,
    s: sinFactViejos.length
       ? `${sinFactViejos.length} ${sinFactViejos.length===1?'lleva':'llevan'} más de una semana · el más viejo ${Math.max(...sinFact.map(x=>dias(x.fecha_cierre||inicioJob(x),h)))} días`
       : 'Ya se pueden cobrar'});
  if(vencidas.length) n.push({i:'cobranza', c:'r',
    t:`${vencidas.length} ${vencidas.length===1?'factura vencida':'facturas vencidas'}`,
    s:`Más de 30 días sin pago${VE_DINERO()?' · '+cf(vencidas.reduce((a,x)=>a+Number(x.invoice_monto||0),0)):''}`});
  if(porCobrar && VE_DINERO()) n.push({i:'cobranza', c:'m', t:`${cf(porCobrar)} por cobrar`,
    s:'Invoices emitidos que no se han pagado'});
  if(repHoy) n.push({i:'reporte', c:'a', t:`${repHoy} ${repHoy===1?'reporte':'reportes'} de hoy`,
    s:'Ya entraron del campo'});
  if(!n.length) n.push({i:'resumen', c:'a', t:'Todo tranquilo', s:'No hay nada que requiera atención inmediata'});

  return `<div class="eyebrow">Pulso del día</div>
    <div class="pulso">${n.slice(0,6).map((x,i)=>`
      <div class="pz ${x.c}" data-ir="${x.i}" style="animation-delay:${i*0.06}s">
        <div class="pz-ic">${svgIC(x.i)}</div>
        <div class="pz-t">${esc(x.t)}</div>
        <div class="pz-s">${esc(x.s)}</div>
      </div>`).join('')}</div>`;
}

let SONIDO = true;
try{ SONIDO = localStorage.getItem('jr31_sonido') !== 'off'; }catch(e){}
let ULT_NOTIF = 0, VIGIA = null;

function tono(tipo){
  if(!SONIDO) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ac = new AC();
    const notas = tipo==='urgente' ? [880, 660, 880] : [660, 880];
    notas.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=f;
      o.connect(g); g.connect(ac.destination);
      const t=ac.currentTime + i*0.13;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
      o.start(t); o.stop(t+0.14);
    });
    setTimeout(()=>{ try{ ac.close(); }catch(e){} }, 900);
  }catch(e){}
}

async function vigilarAvisos(){
  if(!U) return;
  try{
    let q=sb.from('notificaciones').select('id,titulo,texto,job_id,tipo,created_at')
      .eq('leida',false).order('created_at',{ascending:false}).limit(4);
    q = U.rol==='tecnico' ? q.eq('para_usuario',U.id) : q.neq('para_rol','tecnico');
    q=q.eq('departamento',DEPV());
    const {data}=await q;
    const nuevas=(data||[]).filter(x=>new Date(x.created_at).getTime() > ULT_NOTIF);
    if(ULT_NOTIF && nuevas.length){
      tono(nuevas.some(x=>/urgen|falta|sin reporte/i.test(x.titulo||''))?'urgente':'normal');
      vibrar();
      nuevas.slice(0,2).forEach((n,i)=>setTimeout(()=>avisoFlotante(n.titulo,n.texto,n.job_id), i*700));
      contarNotif().then(()=>{ const b=document.querySelector('.campana'); if(b) b.classList.add('sacude'); });
    }
    if(data && data.length) ULT_NOTIF = Math.max(ULT_NOTIF, ...data.map(x=>new Date(x.created_at).getTime()));
    else if(!ULT_NOTIF) ULT_NOTIF = Date.now();
  }catch(e){}
}

function arrancarVigia(){
  if(VIGIA) clearInterval(VIGIA);
  vigilarAvisos();
  VIGIA = setInterval(vigilarAvisos, 45000);
}

async function contarNotif(){
