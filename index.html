        if(!cliente || !direccion) return toast('Pon el nombre y la dirección.');
      }
      const p={folio, departamento:'cleaning', tipo:$('#t_tp').value, estatus:'activo',
        origen: mgSel?'management':'particular',
        management_id:mgSel||null, propiedad_id:prId,
        cliente, direccion, ciudad, zip, unidad,
        tipo_propiedad: mgSel?'apartamento':'casa',
        fecha_inicio:fecha, precio_carpet:precio, trabajo_especial:true,
        tecnico_id:$('#t_tc').value||null,
        notas:$('#t_nt').value.trim()||null,
        lat: pr?pr.lat:null, lng: pr?pr.lng:null};
      const {data,error}=await sb.from('jobs').insert(p).select().single();
      if(error) return toast('No se creó: '+error.message);

      const tid=$('#t_tc').value;
      if(tid) await sb.from('asignaciones').upsert(
        {job_id:data.id, tecnico_id:tid, fecha, hora:$('#t_hr').value||null},
        {onConflict:'job_id,tecnico_id,fecha'});

      await notifIns({tipo:'job', departamento:'cleaning',
        titulo:'Trabajo especial · '+cliente,
        texto:`${U.nombre} abrió ${folio}${unidad?' · Unit '+unidad:''} · ${p.tipo} · ${cf(precio)}`,
        job_id:data.id, de_usuario:U.nombre, para_rol:'admin'});

      cerrar(); toast('Trabajo especial creado · '+folio); render();
    };
  };
  pinta();
}

/* ==================== COBRANZA · qué falta facturar y cobrar ====================
   Vive del app, no de QuickBooks. Cuando conectemos QBO, estos mismos
   campos se llenan solos y la pantalla no cambia. */

let COBTAB = 'estimados';

async function vCobranza(){
  const h=hoy();
  const [{data:J},{data:ES}] = await Promise.all([
    sb.from('jobs')
      .select('id,folio,cliente,unidad,tipo,estatus,departamento,fecha_inicio,fecha_cierre,created_at,po_number,invoice_num,invoice_fecha,invoice_monto,invoice_pagado,invoice_pago_fecha,precio_carpet,monto_cobrar, managements(nombre), propiedades(nombre)')
      .eq('departamento',DEPV())
      .or('estatus.in.(terminado,facturado),invoice_num.not.is.null')
      .order('fecha_cierre',{ascending:true}).limit(400),
    sb.from('estimados')
      .select('id,folio,cliente,monto,estatus,fecha_envio,created_at,job_id,departamento')
      .eq('departamento',DEPV())
      .in('estatus',['borrador','enviado','aceptado'])
      .order('created_at',{ascending:true}).limit(300)
  ]);

  const T=J||[], E=ES||[];
  const MEST={}; E.forEach(e=>{ if(e.job_id && e.estatus==='aceptado') MEST[e.job_id]=Number(e.monto||0); });
  const JOBF=new Set(T.filter(x=>x.invoice_num||x.estatus==='facturado').map(x=>x.id));

  const cierre = x => x.fecha_cierre || x.fecha_inicio || (x.created_at||'').slice(0,10);
  const sugerido = x => Number(x.invoice_monto||0) || Number(x.precio_carpet||0)
                     || Number(x.monto_cobrar||0) || MEST[x.id] || 0;
  const eFecha = e => e.fecha_envio || (e.created_at||'').slice(0,10);

  // ── Las cuatro listas ──
  const borradores  = E.filter(x=>x.estatus==='borrador');
  const esperando   = E.filter(x=>x.estatus==='enviado')
                       .sort((a,b)=>dias(eFecha(b),h)-dias(eFecha(a),h));
  const aceptSinFac = E.filter(x=>x.estatus==='aceptado' && x.job_id && !JOBF.has(x.job_id));
  // OJO: un job con estatus 'facturado' YA está facturado, aunque le falte
  // el número de invoice (los viejos no lo traen porque la columna es nueva).
  // Solo 'terminado' cuenta como pendiente de facturar.
  const porFacturar = T.filter(x=>x.estatus==='terminado' && !x.invoice_num)
                       .sort((a,b)=>dias(cierre(b),h)-dias(cierre(a),h));
  const porCobrar   = T.filter(x=>(x.estatus==='facturado'||x.invoice_num) && !x.invoice_pagado)
                       .sort((a,b)=>(a.invoice_fecha||cierre(a)).localeCompare(b.invoice_fecha||cierre(b)));
  const pagadas     = T.filter(x=>x.invoice_pagado)
                       .sort((a,b)=>(b.invoice_pago_fecha||'').localeCompare(a.invoice_pago_fecha||''));
  // Facturados de antes a los que les falta capturar el número
  const sinNumero   = porCobrar.filter(x=>!x.invoice_num);

  const totF = porFacturar.reduce((a,x)=>a+sugerido(x),0);
  const totC = porCobrar.reduce((a,x)=>a+Number(x.invoice_monto||0),0);
  const totE = esperando.reduce((a,x)=>a+Number(x.monto||0),0);
  const venc = porCobrar.filter(x=>x.invoice_fecha && dias(x.invoice_fecha,h)>=30);

  // ── LO QUE URGE · lo más viejo de todo, junto ──
  const urge=[];
  esperando.filter(x=>dias(eFecha(x),h)>=7).forEach(x=>urge.push({
    d:dias(eFecha(x),h), tipo:'estimado', id:x.id, esEst:true,
    t:(x.cliente||'Sin nombre'), s:'estimado enviado sin respuesta',
    m:Number(x.monto||0), acc:'INSISTIR'}));
  porFacturar.filter(x=>dias(cierre(x),h)>=7).forEach(x=>urge.push({
    d:dias(cierre(x),h), tipo:'facturar', id:x.id,
    t:(x.propiedades?.nombre||x.cliente||'Sin nombre'), s:'terminado y sin facturar',
    m:sugerido(x), acc:'FACTURAR'}));
  venc.forEach(x=>urge.push({
    d:dias(x.invoice_fecha,h), tipo:'cobrar', id:x.id,
    t:(x.propiedades?.nombre||x.cliente||'Sin nombre'), s:'factura '+(x.invoice_num||'')+' sin pago',
    m:Number(x.invoice_monto||0), acc:'COBRAR'}));
  aceptSinFac.forEach(x=>urge.push({
    d:dias(eFecha(x),h), tipo:'aceptado', id:x.id, esEst:true,
    t:(x.cliente||'Sin nombre'), s:'estimado aceptado que nunca se facturó',
    m:Number(x.monto||0), acc:'REVISAR'}));
  urge.sort((a,b)=>b.d-a.d);
  const totUrge = urge.reduce((a,x)=>a+x.m,0);
  const conMonto = urge.filter(x=>x.m>0).length;

  const LISTA = COBTAB==='estimados' ? esperando.concat(borradores)
              : COBTAB==='facturar' ? porFacturar
              : COBTAB==='cobrar' ? porCobrar : pagadas;

  const filaEst = x=>{
    const d=dias(eFecha(x),h), alerta=x.estatus==='enviado'&&d>=7;
    return `<div class="fila ${alerta?'r':(x.estatus==='borrador'?'m':'')}" data-est="${x.id}" style="cursor:pointer">
      <div class="t"><b>${esc(x.cliente||'Sin nombre')}</b>
        <span class="sub">${esc(x.folio||'')} · ${x.estatus==='borrador'?'borrador sin enviar':'enviado hace '+d+' '+(d===1?'día':'días')}</span>
        ${alerta?'<span class="meta" style="color:var(--rojo)">Ya urge insistir</span>':''}</div>
      <div style="text-align:right">
        ${VE_DINERO()&&x.monto?`<div class="disp" style="font-size:17px">${cf(x.monto)}</div>`:''}
        <span class="chip ${x.estatus==='borrador'?'ambar':'rojo'}">${x.estatus.toUpperCase()}</span></div>
    </div>`;
  };

  const filaJob = x=>{
    const d = COBTAB==='cobrar' ? dias(x.invoice_fecha||cierre(x),h) : dias(cierre(x),h);
    const alerta = COBTAB==='cobrar' ? d>=30 : d>=7;
    const monto = COBTAB==='facturar' ? sugerido(x) : Number(x.invoice_monto||0);
    return `<div class="fila ${alerta?'r':''}" data-cob="${x.id}" style="cursor:pointer">
      <div class="t"><b>${esc(x.propiedades?.nombre||x.cliente||'Sin nombre')}</b>
        <span class="sub">${x.unidad?'Unit '+esc(x.unidad)+' · ':''}${esc(x.tipo||'')}${x.po_number?' · PO '+esc(x.po_number):''}</span>
        <span class="meta">${esc(x.folio||'')}${x.managements?.nombre?' · '+esc(x.managements.nombre):''}
          · ${COBTAB==='cobrar'?(x.invoice_fecha?'facturado hace':'cerrado hace'):'terminado hace'} ${d} ${d===1?'día':'días'}
          ${COBTAB==='cobrar'&&x.invoice_num?' · inv '+esc(x.invoice_num):''}</span>
        ${(COBTAB==='cobrar'&&!x.invoice_num)?'<span class="chip ambar">SIN NÚMERO</span>':''}</div>
      <div style="text-align:right">
        ${VE_DINERO()&&monto?`<div class="disp" style="font-size:17px">${cf(monto)}</div>`:''}
        ${COBTAB==='pagadas'
          ? `<span class="chip azul">PAGADA</span>`
          : `<button class="btn mini" data-mk="${x.id}">${COBTAB==='facturar'?'FACTURAR':(x.invoice_num?'MARCAR PAGADA':'CAPTURAR')}</button>`}
      </div></div>`;
  };

  return `
    ${selectorDep()}

    ${sinNumero.length?`
    <div class="alerta" style="margin-bottom:14px;border-left-color:var(--ambar)">
      <div class="t">${sinNumero.length} ${sinNumero.length===1?'factura vieja sin número':'facturas viejas sin número'}</div>
      <div class="sub">Están marcadas como facturadas de antes, pero nunca se les capturó el invoice. Búscalas en la pestaña <b>Por cobrar</b> con el chip SIN NÚMERO y ponles su número y monto, o márcalas pagadas si ya te las pagaron.</div>
    </div>`:''}

    ${urge.length?`
    <div class="alerta" style="margin-bottom:16px">
      <div class="t">${urge.length} ${urge.length===1?'cosa necesita atención':'cosas necesitan atención'}${(VE_DINERO()&&totUrge)?' · '+cf(totUrge)+(conMonto<urge.length?' en '+conMonto+' con monto':' en juego'):''}</div>
      <div class="sub" style="margin-bottom:10px">Lo más viejo primero. Esto es lo que se te está quedando atorado.</div>
      ${urge.slice(0,8).map(u=>`
        <div class="fila r" data-${u.esEst?'est':'cob'}="${u.id}" style="cursor:pointer;margin-bottom:6px">
          <span class="disp" style="font-size:20px;width:70px;flex:0 0 70px;color:var(--rojo)">${u.d}d</span>
          <div class="t"><b>${esc(u.t)}</b><span class="sub">${esc(u.s)}</span></div>
          <div style="text-align:right">
            ${VE_DINERO()&&u.m?`<div class="disp" style="font-size:16px">${cf(u.m)}</div>`:''}
            <span class="chip rojo">${u.acc}</span></div>
        </div>`).join('')}
      ${urge.length>8?`<div class="sub" style="margin-top:6px">y ${urge.length-8} más abajo</div>`:''}
    </div>`:`
    <div class="ok" style="margin-bottom:16px"><div class="t">Todo al corriente.</div>
      <div class="sub">No hay estimados atorados ni facturas vencidas.</div></div>`}

    <div class="row" style="gap:10px;margin-bottom:14px">

/* ==================== IMPORTAR DE GOOGLE CALENDAR ====================
   Lee un archivo .ics exportado de Google Calendar, interpreta los
   títulos como los escribe oficina, y los convierte en jobs.
   Nada se guarda hasta que revisas y das Importar. */

const GC_CODMG = {GS:'Greystar', SD:'Stay San Diego', RPM:'RPM', AIR:'AIR', MRV:'Mission Rio Vista'};
const GC_CARPETKW = ['carpet clean','carpet cleanig','carpet cleaning','rug clean','uphpostety',
  'upholstery','uphostery','tile and grout','grout','power wash','pressure wash','deep clean',
  'move out','duct clean','window clean','new carpet','floor install','shampoo','encapsulation'];
const GC_RESTKW = ['demo','moisture','drywall','flood','water','mold','remediation','reconstruction',
  'fire','smoke','extraction','dehu','air mover','baseboard','construccion','leak'];
let GCROWS = null;

function gcClasifica(txt){
  const t=(txt||'').toLowerCase(); let c=0,r=0;
  GC_CARPETKW.forEach(k=>{ if(t.includes(k)) c++; });
  GC_RESTKW.forEach(k=>{ if(t.includes(k)) r++; });
  return c>r ? 'cleaning' : (r>c ? 'restoration' : null);
}

function gcParse(sum){
  const raw=(sum||'').trim();
  const o={raw, folio:null, mg:null, propiedad:null, unidad:null,
           servicio:null, po:null, dep:null, nota:null};
  const po=raw.match(/PO\s*#?\s*([0-9]{4,})/i);
  if(po) o.po=po[1];
  const limpio = raw.replace(/\s*PO\s*#?\s*[0-9]{4,}\s*/ig,' ').trim();

  const f=raw.match(/^(\d{4})-(\d{3,5})\s*([A-Z]{3,4})?\s*-\s*([A-Z]{2,4})/);
  if(f){ o.folio=f[1]+'-'+f[2]+(f[3]||''); o.mg=GC_CODMG[f[4]]||null; }

  let partes=limpio.split(/\s*--+\s*/).map(x=>x.trim()).filter(Boolean);
  if(partes.length) partes[0]=partes[0].replace(/^\d{4}-\d{3,5}\s*[A-Z]{0,4}\s*-\s*[A-Z]{2,4}\s*/,'').trim();
  partes=partes.filter(Boolean);

  if(partes[0] && /^(restoration|carpet|cleaning)$/i.test(partes[0])){
    o.dep = /restoration/i.test(partes[0]) ? 'restoration':'cleaning';
    partes.shift();
  }
  partes = partes.filter(x=>{
    if(Object.values(GC_CODMG).some(v=>v.toLowerCase()===x.toLowerCase())){ o.mg=o.mg||x; return false; }
    return true;
  });
  if(partes.length>2 && partes[0].split(/\s+/).length>4 && !/\d/.test(partes[0])) o.nota=partes.shift();

  if(partes.length>1 && gcClasifica(partes[partes.length-1])) o.servicio=partes.pop();

  if(partes.length){
    let p=partes.join(' ');
    const u=p.match(/(?:UNIT|#|APT)\s*([A-Z0-9\-]+)\s*$/i) || p.match(/\s([0-9]{2,4}(?:-[0-9]{1,4})?)\s*$/);
    if(u){ o.unidad=u[1]; p=p.slice(0,u.index).trim(); }
    o.propiedad=p||null;
  }
  if(!o.servicio && o.propiedad){
    const m=o.propiedad.match(/(CARPET CLEAN\w*|RUG CLEAN|UPH\w+|DRYWALL REPAIR|NEW CARPET.*)$/i);
    if(m){ o.servicio=m[1]; o.propiedad=o.propiedad.slice(0,m.index).trim()||null; }
  }
  o.dep = o.dep || gcClasifica(o.servicio||'') || gcClasifica(raw) || null;
  o.esNota = !o.folio && !o.dep;
  return o;
}

// Traduce el servicio escrito a mano al catálogo TIPOS
function gcTipo(dep, serv){
  const t=(serv||'').toLowerCase();
  if(dep==='cleaning'){
    if(t.includes('uph')) return 'upholstery cleaning';
    if(t.includes('rug')) return 'area rug cleaning';
    if(t.includes('tile')||t.includes('grout')) return 'tile and grout';
    if(t.includes('power wash')||t.includes('pressure')) return 'pressure washing';
    if(t.includes('move out')) return 'move out clean';
    if(t.includes('deep clean')) return 'deep clean';
    if(t.includes('duct')) return 'air duct cleaning';
    if(t.includes('window')) return 'window clean';
    if(t.includes('new carpet')||t.includes('install')) return 'floor installation';
    if(t.includes('carpet')) return 'carpet cleaning';
    return 'carpet cleaning';
  }
  if(t.includes('mold')||t.includes('remediation')) return 'mold remediation';
  if(t.includes('fire')||t.includes('smoke')) return 'fire / smoke';
  if(t.includes('recon')||t.includes('drywall')||t.includes('construccion')) return 'reconstruction';
  if(t.includes('moisture')||t.includes('check')||t.includes('inspect')) return 'inspection';
  return 'flood service';
}

// Lector de .ics — desdobla las líneas partidas y saca los VEVENT
function gcLeerICS(txt){
  const lineas = txt.replace(/\r/g,'').replace(/\n[ \t]/g,'').split('\n');
  const ev=[]; let cur=null;
  for(const ln of lineas){
    if(ln.startsWith('BEGIN:VEVENT')){ cur={}; continue; }
    if(ln.startsWith('END:VEVENT')){ if(cur) ev.push(cur); cur=null; continue; }
    if(!cur) continue;
    const i=ln.indexOf(':'); if(i<0) continue;
    const clave=ln.slice(0,i).split(';')[0].toUpperCase();
    const val=ln.slice(i+1).replace(/\\n/g,'\n').replace(/\\,/g,',').replace(/\\;/g,';').replace(/\\\\/g,'\\');
    if(clave==='SUMMARY') cur.sum=val;
    else if(clave==='DTSTART') cur.ini=ln.slice(i+1);
    else if(clave==='UID') cur.uid=val;
    else if(clave==='DESCRIPTION') cur.desc=val;
    else if(clave==='LOCATION') cur.loc=val;
  }
  return ev;
}
function gcFecha(v){
  if(!v) return null;
  const m=String(v).match(/(\d{4})(\d{2})(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}

async function gcEnganchar(){
  const b=$('#gcleer'); if(!b) return;
  b.onclick=async()=>{
    const f=$('#gcfile').files[0];
    if(!f) return toast('Escoge primero el archivo .ics');
    const d1=$('#gcd1').value, d2=$('#gcd2').value;
    $('#gcout').innerHTML='<div class="empty">Leyendo…</div>';
    let txt;
    try{ txt=await f.text(); }catch(e){ return toast('No se pudo leer el archivo.'); }

    const ev=gcLeerICS(txt);
    if(!ev.length){ $('#gcout').innerHTML='<div class="alerta"><div class="t">Ese archivo no trae eventos.</div><div class="sub">Revisa que sea el .ics que sale del zip de Google, no el zip.</div></div>'; return; }

    const [{data:mgs},{data:props},{data:yaJ}] = await Promise.all([
      sb.from('managements').select('id,nombre').eq('activo',true),
      sb.from('propiedades').select('id,nombre,management_id,direccion,ciudad,zip'),
      sb.from('jobs').select('gcal_uid').not('gcal_uid','is',null)
    ]);
    const MG=mgs||[], PR=props||[], YA=new Set((yaJ||[]).map(x=>x.gcal_uid));
    const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

    GCROWS = ev.map(e=>{
      const fecha=gcFecha(e.ini);
      const o=gcParse(e.sum);
      const mg = o.mg ? MG.find(m=>norm(m.nombre)===norm(o.mg)) : null;
      let pr=null;
      if(o.propiedad){
        pr = PR.find(p=>norm(p.nombre)===norm(o.propiedad))
          || PR.find(p=>norm(p.nombre) && (norm(o.propiedad).includes(norm(p.nombre)) || norm(p.nombre).includes(norm(o.propiedad))));
      }
      return {uid:e.uid, fecha, raw:e.sum||'', desc:e.desc||'', loc:e.loc||'',
        ...o, mg_id: mg?mg.id : (pr?pr.management_id:null), pr_id: pr?pr.id:null,
        ya: YA.has(e.uid), usar: !!(fecha && !o.esNota && !YA.has(e.uid))};
    }).filter(r=>r.fecha && (!d1||r.fecha>=d1) && (!d2||r.fecha<=d2))
      .sort((a,b)=>b.fecha.localeCompare(a.fecha));

    gcPintar(MG,PR);
  };
}

function gcPintar(MG,PR){
  const R=GCROWS;
  const listos=R.filter(r=>r.usar).length;
  const rep=R.filter(r=>r.ya).length;
  const notas=R.filter(r=>r.esNota).length;

  const rst=R.filter(r=>r.usar&&r.dep==='restoration').length;

  $('#gcout').innerHTML=`
    <div class="row" style="gap:10px;margin-bottom:12px">
      <div class="stat" style="flex:1"><div class="l">LISTOS</div><div class="v">${listos}</div><div class="s">de ${R.length} eventos</div></div>
      <div class="stat" style="flex:1"><div class="l">CARPET</div><div class="v" style="color:var(--azul)">${cln}</div><div class="s">restoration ${rst}</div></div>
      <div class="stat" style="flex:1"><div class="l">SE BRINCAN</div><div class="v">${rep+notas}</div><div class="s">${rep} ya estaban · ${notas} recados</div></div>

    <div style="overflow-x:auto">

      <th></th><th>Fecha</th><th>Título en el calendario</th><th>Área</th><th>Management</th><th>Propiedad</th><th>Unidad</th><th>Servicio</th>
    </tr></thead><tbody>
    ${R.map((r,i)=>`<tr class="${r.usar?'':'apagado'}" style="${r.usar?'':'opacity:.4'}">
      <td><input type="checkbox" data-u="${i}" ${r.usar?'checked':''} ${r.ya?'disabled':''}></td>
      <td class="mono" style="white-space:nowrap">${esc(r.fecha)}</td>
      <td style="max-width:280px;font-size:12px">${esc(r.raw)}
        ${r.ya?'<br><span class="chip">YA IMPORTADO</span>':''}
        ${r.esNota?'<br><span class="chip ambar">PARECE RECADO</span>':''}
        ${r.po?'<br><span class="chip azul">PO '+esc(r.po)+'</span>':''}</td>
      <td><select data-f="dep" data-i="${i}">
        <option value="">— ?</option>
        <option value="cleaning" ${r.dep==='cleaning'?'selected':''}>carpet</option>
        <option value="restoration" ${r.dep==='restoration'?'selected':''}>restoration</option></select></td>
      <td><select data-f="mg_id" data-i="${i}"><option value="">— ninguno</option>
        ${MG.map(m=>`<option value="${m.id}" ${r.mg_id===m.id?'selected':''}>${esc(m.nombre)}</option>`).join('')}</select></td>
      <td><select data-f="pr_id" data-i="${i}"><option value="">${r.propiedad?esc(r.propiedad)+' (nueva)':'— ninguna'}</option>
        ${PR.map(p=>`<option value="${p.id}" ${r.pr_id===p.id?'selected':''}>${esc(p.nombre)}</option>`).join('')}</select></td>
      <td><input data-f="unidad" data-i="${i}" value="${esc(r.unidad||'')}" style="width:80px" class="mono"></td>
      <td><input data-f="servicio" data-i="${i}" value="${esc(r.servicio||'')}" style="width:150px;font-size:12px"></td>
    </tr>`).join('')}
    </tbody></table></div>
    <div style="height:14px"></div>
    <button class="btn wide" id="gcgo">Importar ${listos} ${listos===1?'trabajo':'trabajos'}</button>`;

  document.querySelectorAll('[data-u]').forEach(c=>c.onchange=()=>{
    GCROWS[+c.dataset.u].usar=c.checked;
    c.closest('tr').style.opacity=c.checked?'':'.4';
  });
  document.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{
    GCROWS[+el.dataset.i][el.dataset.f]= el.value||null;
  });
  $('#gcgo').onclick=()=>gcImportar(PR);
}

async function gcImportar(PR){
  const usar=GCROWS.filter(r=>r.usar && r.dep);
  if(!usar.length) return toast('No hay nada marcado, o les falta el área.');
  if(!confirm('Se van a crear '+usar.length+' jobs. ¿Le seguimos?')) return;

  $('#gcgo').disabled=true; $('#gcgo').textContent='Importando…';
  let ok=0, mal=0; const errs=[];

  for(const r of usar){
    try{
      const pr=PR.find(p=>p.id===r.pr_id);
      const folio = r.folio || await nuevoFolio(r.dep);
      const p={folio, departamento:r.dep, tipo:gcTipo(r.dep,r.servicio),
        estatus:'terminado', origen: r.mg_id?'management':'particular',
        management_id:r.mg_id||null, propiedad_id:r.pr_id||null,
        cliente: pr?pr.nombre:(r.propiedad||'Sin nombre'),
        direccion: pr?(pr.direccion||''):(r.loc||''),
        ciudad: pr?(pr.ciudad||'San Diego'):'San Diego',
        zip: pr?pr.zip:null,
        unidad:r.unidad||null, tipo_propiedad:'apartamento',
        fecha_inicio:r.fecha, po_number:r.po||null,
        gcal_uid:r.uid,
        notas:[r.nota, r.desc, 'Importado de Google Calendar · '+r.raw].filter(Boolean).join('\n')};
      const {error}=await sb.from('jobs').insert(p);
      if(error) throw error;
      ok++;
    }catch(e){ mal++; if(errs.length<5) errs.push(r.raw+' → '+(e.message||e)); }
  }

  $('#gcout').innerHTML=`<div class="${mal?'alerta':'ok'}">
    <div class="t">${ok} ${ok===1?'trabajo importado':'trabajos importados'}${mal?' · '+mal+' fallaron':''}</div>
    ${errs.length?'<div class="sub" style="margin-top:8px">'+errs.map(esc).join('<br>')+'</div>':''}
    <div class="sub" style="margin-top:8px">Entran con estatus <b>terminado</b> porque son historial. Cámbialos desde Jobs si alguno sigue abierto.</div></div>`;
  toast(ok+' importados');
}


async function formJob(id, pre){
  let j = pre || {departamento:DEP, tipo:TIPOS[DEP][0], estatus:'activo', ciudad:'San Diego',
                  tipo_propiedad:'apartamento', origen:'management'};
  if(id){ const {data}=await sb.from('jobs').select('*').eq('id',id).single(); j=data; }
  if(!id && !j.folio) j.folio = await nuevoFolio(j.departamento);
  const [{data:mgs},{data:props},{data:acat},{data:mcat},{data:tecsJ}] = await Promise.all([
    sb.from('managements').select('id,nombre').eq('activo',true).order('nombre'),
    sb.from('propiedades').select('*').order('nombre'),
    sb.from('areas_catalogo').select('*').order('orden').order('nombre'),
    sb.from('materiales_catalogo').select('*').order('orden').order('nombre'),
    sb.from('usuarios').select('id,nombre,departamento,telefono').eq('rol','tecnico').eq('activo',true).order('nombre')
  ]);
  const MG=mgs||[], PR=props||[], TEC=tecsJ||[];
  let ACAT=(acat||[]).map(x=>x.nombre), MCAT=(mcat||[]).map(x=>x.nombre);

/* ==================== DETALLE DEL JOB ====================
   En vez de una torre de acordeones, un mosaico de cuadros arriba.
   Tocas uno y su contenido se abre abajo, sin perder de vista el resto. */
function plegarSecciones(){
  const cont = document.querySelector('#sheet .sheet-body');
  if(!cont) return;
  const marcas = [...cont.querySelectorAll('[data-sx]')];
  if(!marcas.length) return;

  const rejilla = document.createElement('div');
  rejilla.className = 'sx-grid';
  const panel = document.createElement('div');
  panel.className = 'sx-panel';
  marcas[0].parentNode.insertBefore(rejilla, marcas[0]);
  marcas[0].parentNode.insertBefore(panel, marcas[0]);

  const secciones = [];

  marcas.forEach((m,i)=>{
    const [titulo, icono, flag] = m.dataset.sx.split('|');
    // Guarda todo lo que viene después del marcador hasta el siguiente
    const caja = document.createElement('div');
    caja.className = 's-b';
    let nodo = m.nextSibling;
    while(nodo && !(nodo.nodeType===1 && nodo.hasAttribute && nodo.hasAttribute('data-sx'))){
      const sig = nodo.nextSibling;
      caja.appendChild(nodo);
      nodo = sig;
    }
    m.remove();

    // Cuenta lo que trae para el contador del cuadro
    const filas = caja.querySelectorAll('.card, .fila, .repcard, .notacard, .etapa').length;
    const urg   = caja.querySelectorAll('.alerta, .chip.rojo, .jc-chip.rojo').length;
    const vacia = !caja.textContent.trim() && !caja.querySelector('img,table,input,button');

    const cuadro = document.createElement('button');
    cuadro.type = 'button';
    cuadro.className = 'sx-cuadro' + (urg?' urg':'') + (vacia?' vacia':'');
    cuadro.innerHTML = `<span class="sx-ic">${svgIC(icono||'jobs')}</span>
      <span class="sx-t">${titulo}</span>
      <span class="sx-n">${filas?filas+(filas===1?' punto':' puntos'):(vacia?'sin datos':'ver')}</span>
      ${urg?'<span class="sx-al"></span>':''}`;
    rejilla.appendChild(cuadro);
    secciones.push({cuadro, caja, titulo, abierta:flag==='abierta'});
  });

  const mostrar = (s)=>{
    const yaEsta = s.cuadro.classList.contains('on');
    secciones.forEach(x=>x.cuadro.classList.remove('on'));
    panel.innerHTML='';
    if(yaEsta){ panel.classList.remove('vivo'); return; }   // segundo toque cierra
    s.cuadro.classList.add('on');
    const cab = document.createElement('div');
    cab.className='sx-cab';
    cab.innerHTML = `<b>${s.titulo}</b><button type="button" class="sx-x">Cerrar</button>`;
    panel.appendChild(cab);
    panel.appendChild(s.caja);
    panel.classList.add('vivo');
    cab.querySelector('.sx-x').onclick=()=>mostrar(s);
    panel.scrollIntoView({behavior:'smooth', block:'nearest'});
  };

  secciones.forEach(s=>s.cuadro.onclick=()=>mostrar(s));
  const inicial = secciones.find(s=>s.abierta) || secciones[0];
  if(inicial) mostrar(inicial);
}

function secc(o){
  const {ic, t, resumen, cuerpo, abierta, clase} = o;
  if(!cuerpo || !String(cuerpo).trim()) return '';
  return `<details class="secc ${clase||''}" ${abierta?'open':''}>
    <summary>
      <span class="s-ic">${svgIC(ic||'jobs')}</span>
      <span class="s-t">${esc(t)}</span>
      ${resumen?`<span class="s-r">${resumen}</span>`:''}
      <span class="s-fl">▾</span>
    </summary>
    <div class="s-b">${cuerpo}</div>
  </details>`;
}

/* ============ ZONAS DONDE TRABAJAMOS ============
   Saca del historial completo dónde se concentra el trabajo.
   Los círculos crecen según cuántos trabajos hubo ahí. */

let ZMAPA=null;

async function bloqueZonas(){
  const {data:jobs} = await sb.from('jobs')
    .select('id,ciudad,zip,lat,lng,estatus,invoice_monto,fecha_inicio,created_at, propiedades(nombre,ciudad,zip,lat,lng)')
    .eq('departamento',DEPV()).limit(1500);
  const J=jobs||[];
  if(!J.length) return '';

  const zonas={};
  J.forEach(j=>{
    const ciudad = (j.ciudad || j.propiedades?.ciudad || 'Sin ciudad').trim();
    const k = ciudad.toUpperCase();
    const z = zonas[k] || (zonas[k]={nombre:ciudad, n:0, activos:0, monto:0, lat:0, lng:0, geo:0});
    z.n++;
    if(!['terminado','facturado'].includes(j.estatus)) z.activos++;
    z.monto += Number(j.invoice_monto||0);
    const la=j.lat||j.propiedades?.lat, ln=j.lng||j.propiedades?.lng;
    if(la&&ln){ z.lat+=Number(la); z.lng+=Number(ln); z.geo++; }
  });
  const Z=Object.values(zonas).map(z=>({...z,
      lat: z.geo?z.lat/z.geo:null, lng: z.geo?z.lng/z.geo:null}))
    .sort((a,b)=>b.n-a.n);
  const max=Z[0]?Z[0].n:1;
  const conGeo=Z.filter(z=>z.lat&&z.lng);
  ZONAS_GEO = conGeo;

  const medalla=i=>['🥇','🥈','🥉'][i]||'📍';

  return `
    <div class="eyebrow">🗺️ Zonas donde trabajamos · ${Z.length}</div>
    ${conGeo.length?`<div id="zmapa" class="z-mapa"></div>`:''}
    <div class="z-lista">
      ${Z.slice(0,8).map((z,i)=>`
        <div class="z-r">
          <span class="z-m">${medalla(i)}</span>
          <div class="z-n"><b>${esc(z.nombre)}</b>
            <span>${z.n} ${z.n===1?'trabajo':'trabajos'}${z.activos?' · '+z.activos+' activos':''}</span>
            <div class="z-bar"><i style="width:${Math.round(z.n/max*100)}%"></i></div>
          </div>
          <div class="z-d">${VE_DINERO()&&z.monto?`<b>${cf(z.monto)}</b>`:`<b>${Math.round(z.n/J.length*100)}%</b>`}
            <span>${VE_DINERO()&&z.monto?'facturado':'del total'}</span></div>
        </div>`).join('')}
    </div>
    ${Z.length>8?`<div class="sub">y ${Z.length-8} ${Z.length-8===1?'zona más':'zonas más'}</div>`:''}`;
}

let ZONAS_GEO=[];

function pintarZonas(){
  const el=document.getElementById('zmapa');
  if(!el || typeof L==='undefined' || !ZONAS_GEO.length) return;
  if(ZMAPA){ try{ZMAPA.remove();}catch(e){} ZMAPA=null; }
  ZMAPA=L.map(el,{scrollWheelZoom:false, zoomControl:true});
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(ZMAPA);

  const max=Math.max(...ZONAS_GEO.map(z=>z.n));
  const pts=[];
  ZONAS_GEO.forEach(z=>{
    const peso=z.n/max;
    const color = peso>0.66?'#D42129' : peso>0.33?'#E0B34E' : '#1B56D3';
    L.circleMarker([z.lat,z.lng],{
      radius: 9 + peso*26, color, weight:2,
      fillColor:color, fillOpacity:.28
    }).addTo(ZMAPA).bindPopup(
      `<b>${esc(z.nombre)}</b><br>${z.n} trabajos${z.activos?' · '+z.activos+' activos':''}`);
    pts.push([z.lat,z.lng]);
  });
  if(pts.length===1) ZMAPA.setView(pts[0],11);
  else ZMAPA.fitBounds(pts,{padding:[30,30]});
  setTimeout(()=>{ try{ZMAPA.invalidateSize();}catch(e){} },200);
}

/* ============ RASTRO DE UBICACIÓN ============
   No es seguimiento en vivo: son puntos con hora en los momentos
   que importan (checadas, reportes, cierres). Sirve para comprobar
   que sí estuvo ahí, y protege al técnico de reclamos.
   Solo se toma cuando él usa la app y da permiso. */

async function marcarUbicacion(tipo, jobId){
  try{
    const g = await ubicame();
    if(!g) return null;
    await sb.from('ubicaciones').insert({
      usuario_id:U.id, nombre:U.nombre, tipo, job_id:jobId||null,
      lat:g.lat, lng:g.lng, fecha:hoy(),
      departamento: (U.departamento && U.departamento!=='ambos') ? U.departamento : DEP
    });
    return g;
  }catch(e){ return null; }
}

const ICOTIPO={entrada:'▶', salida:'■', reporte:'✎', cierre:'✓', inicial:'★'};
const NOMTIPO={entrada:'Checó entrada', salida:'Checó salida', reporte:'Mandó reporte',
               cierre:'Cerró trabajo', inicial:'Levantamiento'};

async function vRastro(){
  const h = RASTRO_DIA || hoy();
  const [{data:pts},{data:asis},{data:tecs}] = await Promise.all([
    sb.from('ubicaciones')
      .select('*, jobs(folio,cliente,unidad, propiedades(nombre))')
      .eq('fecha',h).eq('departamento',DEPV()).order('created_at'),
    sb.from('asistencias').select('*').eq('fecha',h),
    sb.from('usuarios').select('id,nombre,departamento').eq('rol','tecnico').eq('activo',true)
  ]);

  const T=(tecs||[]).filter(t=>t.departamento==='ambos'||t.departamento===DEPV());
  const P=pts||[], AS=asis||[];
  // Las checadas también son puntos, aunque vivan en otra tabla
  const extra=[];
  AS.forEach(a=>{
    if(a.ent_lat) extra.push({usuario_id:a.usuario_id, nombre:a.nombre, tipo:'entrada',
      lat:a.ent_lat, lng:a.ent_lng, dir:a.ent_dir, created_at:a.entrada});
    if(a.sal_lat) extra.push({usuario_id:a.usuario_id, nombre:a.nombre, tipo:'salida',
      lat:a.sal_lat, lng:a.sal_lng, dir:a.sal_dir, created_at:a.salida});
  });
  const TODOS=P.concat(extra).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));

  const porTec={};
  TODOS.forEach(p=>{ (porTec[p.usuario_id] ||= []).push(p); });

  const hh=s=>{ try{ return new Date(s).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return '—'; } };
  const km=(a,b)=>{ const R=6371, r=x=>x*Math.PI/180;
    const dLa=r(b.lat-a.lat), dLo=r(b.lng-a.lng);
    const x=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;
    return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); };

  return `
    ${selectorDep()}
    <div class="eyebrow">📍 Rastro del día</div>
    <div class="sub" style="margin-bottom:10px">Puntos con hora de cuando el técnico usó la app. No es seguimiento en vivo: una app web no puede leer el GPS con el teléfono bloqueado.</div>
    <input type="date" id="ra_f" value="${h}" style="margin-bottom:14px">

    ${T.length? T.map(t=>{
      const L=porTec[t.id]||[];
      let rec=0;
      for(let i=1;i<L.length;i++) if(L[i-1].lat&&L[i].lat) rec+=km(L[i-1],L[i]);
      return `
      <div class="ra-t">
        <div class="ra-h">
          <b>${esc(t.nombre)}</b>
          <span>${L.length?L.length+' '+(L.length===1?'punto':'puntos')+(rec>0.3?' · '+rec.toFixed(1)+' km recorridos':''):'sin actividad'}</span>
          ${L.length?`<button class="btn mini" data-ramap="${t.id}">VER EN MAPA</button>`:''}
        </div>
        ${L.length? `<div class="ra-l">${L.map(p=>`
          <div class="ra-p">
            <span class="ra-ic">${ICOTIPO[p.tipo]||'·'}</span>
            <span class="ra-hh">${hh(p.created_at)}</span>
            <span class="ra-tx"><b>${NOMTIPO[p.tipo]||p.tipo}</b>
              ${p.jobs?`<em>${esc(p.jobs.propiedades?.nombre||p.jobs.cliente||'')}${p.jobs.unidad?' · '+esc(p.jobs.unidad):''} · ${esc(p.jobs.folio||'')}</em>`
                : p.dir?`<em>${esc(p.dir)}</em>`:''}</span>
            ${p.lat?`<a class="ra-go" target="_blank" rel="noopener"
              href="https://maps.google.com/?q=${p.lat},${p.lng}">mapa ›</a>`:'<span class="chip">SIN GPS</span>'}
          </div>`).join('')}</div>`
        : '<div class="sub" style="padding:8px 2px">No abrió la app o no dio permiso de ubicación.</div>'}
      </div>`;
    }).join('')
    : '<div class="empty"><div class="disp">Sin técnicos</div><p>No hay técnicos activos en esta área.</p></div>'}`;
}

/* ============ ARRANQUE DEL DÍA ============
   Lo que necesitas ver a primera hora: quién debe qué reporte,
   quién ya checó entrada, y el botón para mandarles su resumen. */

async function bloqueArranque(){
  const h=hoy();
  const [{data:tecs},{data:jobs},{data:reps},{data:asis}] = await Promise.all([
    sb.from('usuarios').select('id,nombre,departamento,telefono').eq('rol','tecnico').eq('activo',true).order('nombre'),
    sb.from('jobs').select('id,folio,cliente,unidad,departamento,tecnico_id,fecha_inicio,created_at, propiedades(nombre)')
      .eq('departamento',DEPV()).not('estatus','in','("terminado","facturado")'),
    sb.from('reportes').select('job_id,fecha,tecnico_id').gte('fecha',hace(30)),
    sb.from('asistencias').select('usuario_id,tipo,fecha').eq('fecha',h)
  ]);

  const T=(tecs||[]).filter(t=>t.departamento==='ambos'||t.departamento===DEPV());
  const J=jobs||[];
  const porJob={}; (reps||[]).forEach(r=>(porJob[r.job_id] ||= new Set()).add(r.fecha));
  const entro=new Set((asis||[]).filter(a=>a.tipo==='entrada').map(a=>a.usuario_id));

  // Cuánto debe cada técnico
  const deuda = T.map(t=>{
    const suyos=J.filter(x=>x.tecnico_id===t.id);
    let total=0, cons=0, viejo=0;
    suyos.forEach(j=>{
      const f=diasFaltantes(j, porJob[j.id]||new Set());
      if(f.length){ total+=f.length; cons++; viejo=Math.max(viejo, dias(f[0],h)); }
    });
    return {t, jobs:suyos.length, faltan:total, conFalta:cons, viejo, checo:entro.has(t.id)};
  }).sort((a,b)=>b.faltan-a.faltan);

  const totalRep = deuda.reduce((a,x)=>a+x.faltan,0);
  const sinChecar = deuda.filter(x=>!x.checo).length;

  return `
    <div class="eyebrow">☀️ Arranque del día</div>
    <div class="ar-box">
      <div class="ar-cab">
        <div><b>${totalRep}</b><span>${totalRep===1?'reporte pendiente':'reportes pendientes'}</span></div>
        <div><b>${T.length-sinChecar}<i>/${T.length}</i></b><span>ya checaron</span></div>
        ${EDIT()?`<button class="btn sm" id="ar_send">Mandar por WhatsApp</button>`:''}
      </div>
      ${deuda.length? `<div class="ar-tecs">${deuda.map(d=>`
        <div class="ar-t ${d.faltan?(d.viejo>=7?'r':'m'):'v'}" data-artec="${d.t.id}">
          <span class="ar-pt ${d.checo?'on':''}"></span>
          <div class="ar-n"><b>${esc(d.t.nombre)}</b>
            <span>${d.jobs} ${d.jobs===1?'trabajo':'trabajos'} · ${d.checo?'ya checó':'sin checar'}</span></div>
          <div class="ar-d">${d.faltan
            ? `<b>${d.faltan}</b><span>${d.faltan===1?'reporte':'reportes'}${d.viejo?' · '+d.viejo+'d':''}</span>`
            : '<em>al corriente</em>'}</div>
        </div>`).join('')}</div>`
      : '<div class="sub">No hay técnicos activos en esta área.</div>'}
    </div>`;
}

/* El resumen se manda por WhatsApp, uno por uno.
   El navegador no deja abrir varias ventanas de golpe, así que
   se muestra la lista y tú vas mandando. */
async function mandarResumenTecnicos(){
  if(!EDIT()) return toast('Solo administración manda los resúmenes.');
  const h=hoy();
  const [{data:tecs},{data:jobs}] = await Promise.all([
    sb.from('usuarios').select('id,nombre,departamento,telefono').eq('rol','tecnico').eq('activo',true),
    sb.from('jobs').select('id,folio,cliente,unidad,departamento,tecnico_id,fecha_inicio,created_at, propiedades(nombre)')
      .eq('departamento',DEPV()).not('estatus','in','("terminado","facturado")')
  ]);
  const T=(tecs||[]).filter(t=>t.departamento==='ambos'||t.departamento===DEPV());
  const J=jobs||[];
  if(!T.length) return toast('No hay técnicos activos en esta área.');
  const {data:reps}=await sb.from('reportes').select('job_id,fecha')
    .in('job_id',J.length?J.map(x=>x.id):['-']).gte('fecha',hace(30));
  const porJob={}; (reps||[]).forEach(r=>(porJob[r.job_id] ||= new Set()).add(r.fecha));

  const armados = T.map(t=>{
    const suyos=J.filter(x=>x.tecnico_id===t.id);
    const detalle=[]; let total=0;
    suyos.forEach(j=>{
      const f=diasFaltantes(j, porJob[j.id]||new Set());
      if(f.length){ total+=f.length;
        detalle.push(`${j.folio||''} · ${(j.propiedades?.nombre||j.cliente||'')}${j.unidad?' Unit '+j.unidad:''} — ${f.length} ${f.length===1?'día':'días'} desde ${fmt(f[0])}`); }
    });
    const primero=(t.nombre||'').split(' ')[0];
    const msg = total
      ? `Buenos días ${primero}.\n\nTu resumen de hoy ${fmt(h)}:\nTienes ${suyos.length} ${suyos.length===1?'trabajo abierto':'trabajos abiertos'} y te faltan ${total} ${total===1?'reporte':'reportes'}.\n\n${detalle.map(d=>'• '+d).join('\n')}\n\nÁbrelos en la app y ciérralos, o marca por qué no fuiste. Gracias.`
      : `Buenos días ${primero}.\n\nVas al corriente, no debes reportes. Tienes ${suyos.length} ${suyos.length===1?'trabajo abierto':'trabajos abiertos'}. Gracias.`;
    return {t, suyos:suyos.length, total, msg, tel:(t.telefono||'').replace(/[^0-9]/g,'')};
  }).sort((a,b)=>b.total-a.total);

  $('#sheet').innerHTML=`<div class="sheet"><div class="sheet-head">
    <div><div class="mono" style="font-size:11px;color:#C3D6F7">${fmt(h)}</div>
    <div class="disp" style="font-size:21px;line-height:1">Mandar resumen por WhatsApp</div>
    <div style="font-size:13px;color:#C3D6F7">${armados.length} ${armados.length===1?'técnico':'técnicos'}</div></div>
    <button class="x" id="c1">✕</button></div>
    <div class="franja split"><i></i><i></i></div>
    <div class="sheet-body">
      <div class="sub" style="margin-bottom:12px">Se abre WhatsApp con el mensaje ya escrito. Nada más le das enviar.</div>
      ${armados.map((a,i)=>`<div class="fila ${a.total?(a.total>5?'r':'m'):'a'}">
        <div class="t"><b>${esc(a.t.nombre)}</b>
          <span class="sub">${a.suyos} ${a.suyos===1?'trabajo':'trabajos'} · ${a.total?a.total+(a.total===1?' reporte pendiente':' reportes pendientes'):'al corriente'}</span>
          ${!a.tel?'<span class="meta" style="color:var(--rojo)">Sin teléfono cargado</span>':''}</div>
        <div style="text-align:right">
          ${a.tel?`<button class="btn sm" data-wa="${i}">WHATSAPP</button>`
                 :'<span class="chip">FALTA TEL</span>'}
        </div></div>`).join('')}
      <div style="height:14px"></div>
      <button class="btn ghost wide" id="c2">Cerrar</button>
    </div></div>`;

  $('#c1').onclick=$('#c2').onclick=cerrar;
  document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=async()=>{
    const a=armados[+b.dataset.wa];
    window.open('https://wa.me/'+a.tel+'?text='+encodeURIComponent(a.msg),'_blank');
    b.textContent='ENVIADO'; b.classList.add('ghost');
    // Queda también como aviso dentro de la app
    await notifIns({tipo:'recordatorio', clave:'brief-'+a.t.id+'-'+h,
      titulo: a.total?('Tu resumen · debes '+a.total+(a.total===1?' reporte':' reportes')):'Tu resumen del día',
      texto: a.msg, para_rol:'tecnico', para_usuario:a.t.id});
  });
}

/* ============ TABLERO DEL DÍA · CARPET ============
   Pantalla principal del área. Un trabajo por tarjeta y UN solo
   botón grande en cada uno. Nada de decidir entre cinco cosas:
   el trabajo te dice qué sigue. */

async function vHoyCarpet(){
  const h=hoy();
  const [{data:asig},{data:reps},{data:jobs}] = await Promise.all([
    sb.from('asignaciones')
      .select('job_id,hora, jobs(id,folio,cliente,unidad,tipo,estatus,departamento,direccion,invoice_num,invoice_monto,invoice_pagado,invoice_revision,invoice_revision_nota,precio_carpet, propiedades(nombre)), usuarios(nombre)')
      .eq('fecha',h).order('hora'),
    sb.from('reportes').select('job_id,fecha,tecnico_id').gte('fecha',hace(45)),
    sb.from('jobs')
      .select('id,folio,cliente,unidad,tipo,estatus,fecha_cierre,fecha_inicio,created_at,invoice_num,invoice_monto,invoice_pagado,invoice_revision,invoice_revision_nota,precio_carpet, propiedades(nombre)')
      .eq('departamento','cleaning')
      .or('estatus.in.(activo,terminado),invoice_num.not.is.null')
      .order('fecha_inicio',{ascending:false}).limit(120)
  ]);

  const conRep = new Set((reps||[]).map(r=>r.job_id));
  const repHoy = new Set((reps||[]).filter(r=>r.fecha===h).map(r=>r.job_id));

  // Lo de hoy: lo agendado + lo que se terminó hoy
  const A = (asig||[]).filter(a=>a.jobs && a.jobs.departamento==='cleaning');
  const idsHoy = new Set(A.map(a=>a.job_id));
  const J = jobs||[];

  // Lo que quedó colgado de días pasados
  const atras = J.filter(x=>!idsHoy.has(x.id) &&
    ((x.estatus==='terminado' && !x.invoice_num) || (x.estatus==='activo' && !conRep.has(x.id))));

  const facHoy = J.filter(x=>x.invoice_num && (x.fecha_cierre===h));
  const totHoy = facHoy.reduce((a,x)=>a+Number(x.invoice_monto||0),0);

  // Qué sigue para este trabajo · esto decide el botón
  const paso = x=>{
    if(x.invoice_revision==='corregir') return {k:'corregir', t:'HAY QUE CORREGIRLA', c:'r'};
    if(x.invoice_pagado) return {k:'pagado', t:'PAGADO', c:'v'};
    if(x.invoice_num)    return {k:'listo',  t:x.invoice_revision==='aprobada'?'APROBADA':'FACTURADO', c:'v'};
    if(x.estatus==='terminado' || conRep.has(x.id))
      return {k:'facturar', t:'FALTA EL INVOICE', c:'r'};
    return {k:'reporte', t:'FALTA EL REPORTE', c:'m'};
  };

  const tarjeta = (x, hora, tec)=>{
    const p=paso(x);
    const puedeFac = FACTURA();
    let btn='';
    if(p.k==='corregir')      btn=`<button class="cp-b cor" data-cpfac="${x.id}">Corregir la factura</button>`;
    else if(p.k==='reporte')  btn=`<button class="cp-b rep" data-cprep="${x.id}">Dejar reporte</button>`;
    else if(p.k==='facturar') btn= puedeFac
        ? `<button class="cp-b fac" data-cpfac="${x.id}">Hacer invoice</button>`
        : `<button class="cp-b esp" disabled>Esperando factura</button>`;
    else                      btn=`<button class="cp-b ver" data-cpver="${x.id}">Ver la factura</button>`;

    return `<div class="cp-card ${p.c}">
      <div class="cp-top">
        ${hora?`<span class="cp-h">${esc(hora)}</span>`:''}
        <span class="cp-est ${p.c}">${p.t}</span>
      </div>
      <div class="cp-nom">${esc(x.propiedades?.nombre||x.cliente||'Sin nombre')}</div>
      <div class="cp-sub">${x.unidad?'Unidad '+esc(x.unidad):'sin unidad'} · ${esc(x.tipo||'')}</div>
      ${x.invoice_revision==='corregir'&&x.invoice_revision_nota?`<div class="cp-nota">${esc(x.invoice_revision_nota)}</div>`:''}
      <div class="cp-pie">${esc(x.folio||'')}${tec?' · '+esc(tec):''}${
        x.invoice_num?' · inv '+esc(x.invoice_num)+(VE_DINERO()&&x.invoice_monto?' · '+cf(x.invoice_monto):''):''}</div>
      ${btn}
    </div>`;
  };

  const F=new Date(h+'T12:00:00');
  const dia=F.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});

  return `
    ${selectorDep()}
    <div class="cp-hoy">
      <div class="cp-fecha">${dia}</div>
      <div class="cp-nums">
        <div><b>${A.length}</b><span>hoy</span></div>
        <div><b>${facHoy.length}</b><span>facturados</span></div>
        ${VE_DINERO()?`<div><b>${cf(totHoy)}</b><span>del día</span></div>`:''}
      </div>
    </div>

    ${FACTURA()?`<button class="btn wide" id="cp_new" style="margin-bottom:16px">+ Hacer invoice nuevo</button>`:''}

    <div class="eyebrow">🧹 Tus trabajos de hoy</div>
    ${A.length
      ? `<div class="cp-grid">${A.map(a=>tarjeta(a.jobs, a.hora, a.usuarios?.nombre)).join('')}</div>`
      : `<div class="ok"><div class="t">Hoy no tienes trabajos agendados.</div>
         <div class="sub">Cuando administración te asigne uno, aparece aquí.</div></div>`}

    ${atras.length?`
      <div class="eyebrow">Se quedaron pendientes · ${atras.length}</div>
      <div class="sub" style="margin-bottom:10px">De días pasados. Ciérralos para que no se acumulen.</div>
      <div class="cp-grid">${atras.slice(0,12).map(x=>tarjeta(x,null,null)).join('')}</div>
      ${atras.length>12?`<div class="sub">y ${atras.length-12} más en Jobs</div>`:''}`:''}

    <div style="height:14px"></div>
    <button class="btn ghost wide" id="cp_todas">Ver todas las facturas de Carpet</button>`;
}

   a los renglones. El job se crea solo por detrás para que quede

  if(!FACTURA()) return toast('Solo administración y el gerente pueden facturar.');

  ]);
  const MG=mgs||[], PR=props||[];

  const pinta=()=>{
    const lista = mgSel ? PR.filter(p=>p.management_id===mgSel) : [];
    $('#sheet').innerHTML=`<div class="sheet"><div class="sheet-head">
      <div><div class="mono" style="font-size:11px;color:#C3D6F7">CARPET DEPARTMENT</div>
      <div class="disp" style="font-size:21px;line-height:1">Nueva factura</div>
      <div style="font-size:13px;color:#C3D6F7">Paso 1 de 2 · ¿a quién le facturas?</div></div>
      <button class="x" id="c1">✕</button></div>

      <div class="sheet-body">
        <label>Management</label>
        <select id="f_mg"><option value="">— particular, sin management —</option>
          ${MG.map(m=>`<option value="${m.id}" ${mgSel===m.id?'selected':''}>${esc(m.nombre)}</option>`).join('')}</select>
        ${mgSel?`<label>Propiedad</label>
          <select id="f_pr"><option value="">— escoge —</option>
            ${lista.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}</select>
          ${!lista.length?'<div class="sub">Ese management no tiene propiedades cargadas. Escoge otro o factura como particular.</div>':''}`
        :`<label>Nombre del cliente</label>
          <input id="f_cli" placeholder="Sra. Martínez">
          <label>Dirección</label>
          <input id="f_dir" placeholder="123 Main St">
          <label>Ciudad</label>
          <input id="f_ciu" value="San Diego">`}
        <div class="g2">
          <div><label>Unidad</label><input id="f_un" placeholder="208"></div>
          <div><label>Fecha del servicio</label><input id="f_fe" type="date" value="${hoy()}"></div>
        </div>
        <label>Servicio</label>
        <select id="f_tp">${TIPOS.cleaning.map(t=>`<option>${esc(t)}</option>`).join('')}</select>
        <label>PO number</label>
        <input id="f_po" placeholder="opcional">
        <div style="height:16px"></div>
        <button class="btn wide" id="f_ok">Seguir a los renglones ›</button>
        <div style="height:8px"></div>
        <button class="btn ghost wide" id="c2">Cancelar</button>
      </div></div>`;

    $('#c1').onclick=$('#c2').onclick=cerrar;
    $('#f_mg').onchange=e=>{ mgSel=e.target.value; pinta(); };

    $('#f_ok').onclick=async()=>{
      const fecha=$('#f_fe').value||hoy();
      let cliente, direccion, ciudad, zip=null, prId=null, pr=null;
      if(mgSel){
        prId=$('#f_pr').value;
        if(!prId) return toast('Escoge la propiedad.');
        pr=PR.find(x=>x.id===prId);
        cliente=pr.nombre; direccion=pr.direccion||''; ciudad=pr.ciudad||'San Diego'; zip=pr.zip||null;
      } else {
        cliente=$('#f_cli').value.trim();
        direccion=$('#f_dir').value.trim();
        ciudad=$('#f_ciu').value.trim()||'San Diego';
        if(!cliente) return toast('Pon el nombre del cliente.');
        if(!direccion) return toast('Pon la dirección.');
      }
      // La factura tiene que salir completa: sin unidad ni fecha no pasa.
      if(!$('#f_un').value.trim()) return toast('Falta la unidad. Toda factura la lleva.');

      const folio=await nuevoFolio('cleaning');

        estatus:'terminado', origen: mgSel?'management':'particular',
        management_id:mgSel||null, propiedad_id:prId,

      if(error) return toast('No se pudo crear: '+error.message);
      toast(folio+' creado · ahora los renglones');
      formInvoiceCarpet(data.id);     // pasa directo al armador
    };
  };
  pinta();
}

      invoice_revisado_por:null, invoice_revisado_fecha:null,

    if(error) return toast('No se pudo borrar: '+error.message);
    await notifIns({tipo:'invoice', departamento:'cleaning',
      titulo:'Se borró el invoice '+j.invoice_num,
      texto:nom+' · '+U.nombre+' lo eliminó. Hay que volver a facturar el trabajo.',
      job_id:id, de_usuario:U.nombre, para_rol:'gerente'});
    cerrar(); toast('Invoice borrado · el trabajo regresó a Por facturar'); render();
  };

/* ============ INVOICES · vista estilo QuickBooks (solo Carpet) ============
   Lista de facturas con estatus, vencimiento y antigüedad de saldo.
   Facturan Jared, Julio y Carlos. Los técnicos no entran aquí. */

let QBTAB = 'todas';

const TERMINOS = {'inmediato':0,'net15':15,'net30':30,'net45':45,'net60':60};

function venceEl(fecha, terminos){
  const d = TERMINOS[terminos||'net30'] ?? 30;
  const x = new Date((fecha||hoy())+'T12:00:00');
  x.setDate(x.getDate()+d);
  return x.toISOString().slice(0,10);
}

async function vInvoicesCarpet(){
  const h=hoy();
  const {data:J} = await sb.from('jobs')
    .select('id,folio,cliente,unidad,tipo,estatus,fecha_cierre,fecha_inicio,created_at,po_number,invoice_num,invoice_fecha,invoice_monto,invoice_pagado,invoice_pago_fecha,invoice_vence,invoice_terminos,invoice_renglones,invoice_revision,invoice_revision_nota,precio_carpet, managements(nombre), propiedades(nombre)')
    .eq('departamento','cleaning')
    .or('estatus.in.(terminado,facturado),invoice_num.not.is.null')
    .order('invoice_fecha',{ascending:false}).limit(500);

  const T=J||[];
  const vence = x => x.invoice_vence || venceEl(x.invoice_fecha, x.invoice_terminos);
  const diasV = x => x.invoice_fecha ? dias(vence(x), h) : 0;   // + = vencida

  const borrador = T.filter(x=>!x.invoice_num);                       // por facturar
  const abiertas = T.filter(x=>x.invoice_num && !x.invoice_pagado);
  const vencidas = abiertas.filter(x=>diasV(x)>0);
  const alCorr   = abiertas.filter(x=>diasV(x)<=0);
  const pagadas  = T.filter(x=>x.invoice_pagado);

  const M = x=>Number(x.invoice_monto||0)||Number(x.precio_carpet||0);
  const tAbier=abiertas.reduce((a,x)=>a+M(x),0);
  const tVenc =vencidas.reduce((a,x)=>a+M(x),0);
  const tBorr =borrador.reduce((a,x)=>a+M(x),0);

  // Antigüedad del saldo, como el aging report de QuickBooks
  const bucket = x=>{ const d=diasV(x);
    return d<=0?'corriente' : d<=30?'1-30' : d<=60?'31-60' : d<=90?'61-90' : '90+'; };
  const AG={corriente:0,'1-30':0,'31-60':0,'61-90':0,'90+':0};
  abiertas.forEach(x=>{ AG[bucket(x)] += M(x); });

  const LISTA = QBTAB==='borrador'? borrador
              : QBTAB==='abiertas'? abiertas
              : QBTAB==='vencidas'? vencidas
              : QBTAB==='pagadas' ? pagadas : T;

  const chip = x=>{
    if(x.invoice_pagado) return '<span class="qb-e pag">PAGADA</span>'
      + (x.invoice_revision==='aprobada'?' <span class="qb-e pag">✓ REVISADA</span>':'');
    if(!x.invoice_num)   return '<span class="qb-e bor">POR FACTURAR</span>';
    if(x.invoice_revision==='corregir') return '<span class="qb-e ven">CORREGIR</span>';
    const d=diasV(x);
    if(d>0) return `<span class="qb-e ven">VENCIDA ${d}d</span>`;
    return `<span class="qb-e abi">ABIERTA</span>`;
  };

  const fila = x=>`<div class="qb-r" data-qb="${x.id}">
    <div class="qb-n">${x.invoice_num?esc(x.invoice_num):'—'}</div>
    <div class="qb-cl"><b>${esc(x.propiedades?.nombre||x.cliente||'Sin nombre')}</b>
      <span>${x.unidad?'Unit '+esc(x.unidad)+' · ':''}${esc(x.tipo||'')}${x.po_number?' · PO '+esc(x.po_number):''}</span>
      <span class="qb-fo">${esc(x.folio||'')}${x.managements?.nombre?' · '+esc(x.managements.nombre):''}</span></div>
    <div class="qb-f">${x.invoice_fecha?fmt(x.invoice_fecha):'—'}
      <span>${x.invoice_num?'vence '+fmt(vence(x)):'sin facturar'}</span></div>
    <div class="qb-m">${VE_DINERO()&&M(x)?cf(M(x)):'—'}</div>
    <div class="qb-s">${chip(x)}</div>
    <div class="qb-a">
      ${!x.invoice_num
        ? (FACTURA()?`<button class="btn mini" data-qbf="${x.id}">FACTURAR</button>`:'')
        : `${ES_ADMIN()?`<button class="btn mini" data-qbr="${x.id}">REVISAR</button>`:''}
           ${(FACTURA()&&!x.invoice_pagado)?`<button class="btn mini" data-qbp="${x.id}">COBRADA</button>`:''}`}
    </div>
  </div>`;

  return `
    <div class="eyebrow">🧾 Invoices · Carpet Department</div>
    ${FACTURA()?`<button class="btn wide no-print" id="qb_new" style="margin-bottom:14px">+ Hacer invoice</button>`:''}

    <div class="qb-cards">
      <div class="qb-k"><span>POR FACTURAR</span>
        <b>${VE_DINERO()?cf(tBorr):borrador.length}</b><i>${borrador.length} trabajos</i></div>
      <div class="qb-k abi"><span>ABIERTAS</span>
        <b>${VE_DINERO()?cf(tAbier):abiertas.length}</b><i>${abiertas.length} facturas</i></div>
      <div class="qb-k ven"><span>VENCIDAS</span>
        <b>${VE_DINERO()?cf(tVenc):vencidas.length}</b><i>${vencidas.length} facturas</i></div>
      <div class="qb-k pag"><span>COBRADO</span>
        <b>${VE_DINERO()?cf(pagadas.reduce((a,x)=>a+M(x),0)):pagadas.length}</b><i>${pagadas.length} pagadas</i></div>
    </div>

    ${(abiertas.length&&VE_DINERO())?`
    <div class="eyebrow">⏳ Antigüedad del saldo</div>
    <div class="qb-age">
      ${Object.entries(AG).map(([k,v])=>`<div class="${v&&k!=='corriente'?'hay':''}">
        <span>${k==='corriente'?'Al corriente':k+' días'}</span><b>${cf(v)}</b></div>`).join('')}
    </div>`:''}

    <div class="tabs">
      <button data-qt="todas" class="${QBTAB==='todas'?'on':''}">Todas · ${T.length}</button>
      <button data-qt="borrador" class="${QBTAB==='borrador'?'on':''}">Por facturar · ${borrador.length}</button>
      <button data-qt="abiertas" class="${QBTAB==='abiertas'?'on':''}">Abiertas · ${abiertas.length}</button>
      <button data-qt="vencidas" class="${QBTAB==='vencidas'?'on':''}">Vencidas · ${vencidas.length}</button>
      <button data-qt="pagadas" class="${QBTAB==='pagadas'?'on':''}">Pagadas · ${pagadas.length}</button>
    </div>

    ${LISTA.length?`
      <div class="qb-h">
        <div>INVOICE</div><div>CLIENTE</div><div>FECHA</div>
        <div style="text-align:right">IMPORTE</div><div>ESTADO</div><div></div>
      </div>
      ${LISTA.map(fila).join('')}`
    : `<div class="empty"><div class="disp">${T.length?'Nada en esta vista':'Todavía no hay facturas'}</div>
       <p>${QBTAB==='vencidas'?'No hay facturas vencidas. Bien.'
         : T.length?'Cambia de pestaña para ver las demás.'
         : 'Dale a <b>+ Nueva factura</b> para hacer la primera. También aparecen aquí solas los trabajos de Carpet que se terminen.'}</p></div>`}

    ${!FACTURA()?'<div class="sub" style="margin-top:14px">Solo administración y el gerente pueden facturar. Tú puedes consultar.</div>':''}`;
}

function engancharInvoicesCarpet(){
  const nb=$('#qb_new'); if(nb) nb.onclick=()=>nuevaFacturaCarpet();
  document.querySelectorAll('[data-qt]').forEach(b=>b.onclick=()=>{ QBTAB=b.dataset.qt; render(); });
  document.querySelectorAll('[data-qb]').forEach(b=>b.onclick=e=>{
    if(e.target.closest('[data-qbf],[data-qbp],[data-qbr]')) return;
    abrirJob(b.dataset.qb);
  });
  document.querySelectorAll('[data-qbf]').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(!FACTURA()) return toast('No tienes permiso para facturar.');
    formInvoiceCarpet(b.dataset.qbf);
  });
  document.querySelectorAll('[data-qbr]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); revisarInvoice(b.dataset.qbr);
  });
  document.querySelectorAll('[data-qbp]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();
    if(!FACTURA()) return toast('No tienes permiso para facturar.');
    marcarPagada(b.dataset.qbp);
  });
}

/* ==================== FACTURACIÓN CARPET ====================
   Catálogo de precios que carga administración + renglones especiales
   cuando el precio no está en la lista. El total del invoice sale
   de los renglones, no de un monto escrito a mano. */

let INVR = [];          // renglones del invoice que se está armando
let PCAT = [];          // catálogo de precios en memoria

const UNIDADES = ['trabajo','pieza','área','cuarto','escalón','hora','lf','ln ft','sq/yd','sqft','parche','set'];
const CATEGORIAS = ['Carpet cleaning','Tile and grout','Vinyl','Upholstery','Vents','Stains removal','Carpet repair','Patches','Power wash','Otros'];

async function siguienteInvoice(){
  const {data}=await sb.from('jobs').select('invoice_num').not('invoice_num','is',null).limit(500);
  const nums=(data||[]).map(x=>parseInt(String(x.invoice_num).replace(/\D/g,''),10)).filter(n=>!isNaN(n));
  return String(nums.length ? Math.max(...nums)+1 : 1001);
}

async function formInvoiceCarpet(jobId){
  const [{data:j},{data:cat}] = await Promise.all([
    sb.from('jobs').select('*, propiedades(nombre), managements(nombre)').eq('id',jobId).single(),
    sb.from('precios_catalogo').select('*').eq('departamento','cleaning').eq('activo',true).order('orden').order('concepto')
  ]);
  if(!j) return toast('No se encontró el trabajo.');
  if(!MIO_DEP(j.departamento)) return sinAcceso();
  if(!FACTURA()){ cerrar(); return toast('Solo administración y el gerente pueden facturar.'); }

  // Lista de precios de esta propiedad. Si la propiedad tiene precio
  // especial para un concepto, ese manda sobre el general.
  const espec = (cat||[]).filter(x=>x.propiedad_id && x.propiedad_id===j.propiedad_id);
  const clavesEsp = new Set(espec.map(x=>(x.concepto||'').toLowerCase().trim()));
  const general = (cat||[]).filter(x=>!x.propiedad_id && !clavesEsp.has((x.concepto||'').toLowerCase().trim()));
  PCAT = espec.concat(general);
  INVR = Array.isArray(j.invoice_renglones) && j.invoice_renglones.length
         ? JSON.parse(JSON.stringify(j.invoice_renglones))
         : [];
  const numSug = j.invoice_num || await siguienteInvoice();
  const nom = j.propiedades?.nombre || j.cliente || 'Sin nombre';

  const pinta=()=>{
    const sub = INVR.reduce((a,r)=>a+(Number(r.cantidad||0)*Number(r.precio||0)),0);
    const imp = sub * (Number($('#iv_tax')?.value||0)/100);
    $('#sheet').innerHTML=`<div class="sheet"><div class="sheet-head">
      <div><div class="mono" style="font-size:11px;color:#C3D6F7">CARPET · ${esc(j.folio||'')}</div>
      <div class="disp" style="font-size:21px;line-height:1">Crear invoice</div>
      <div style="font-size:13px;color:#C3D6F7">${esc(nom)}${j.unidad?' · Unit '+esc(j.unidad):''}</div></div>
      <button class="x" id="c1">✕</button></div>
      <div class="franja split"><i></i><i></i></div>
      <div class="sheet-body">

        <div class="g2">
          <div><label>Número de invoice</label><input id="iv_n" class="mono" value="${esc(numSug)}"></div>
          <div><label>Fecha</label><input id="iv_f" type="date" value="${esc(j.invoice_fecha||hoy())}"></div>
        </div>
        <div class="g2">
          <div><label>PO number</label><input id="iv_po" value="${esc(j.po_number||'')}" placeholder="opcional"></div>
          <div><label>Términos de pago</label><select id="iv_term">
            ${Object.keys(TERMINOS).map(t=>`<option value="${t}" ${(j.invoice_terminos||'net30')===t?'selected':''}>${
              t==='inmediato'?'Pago inmediato':'Net '+TERMINOS[t]+' días'}</option>`).join('')}
          </select></div>
        </div>

        <div class="eyebrow">Renglones · ${INVR.length}</div>
        ${INVR.length?`<div class="inv-tab">
          ${INVR.map((r,i)=>`<div class="inv-r">
            <div class="inv-c">
              <input class="inv-desc" data-f="concepto" data-i="${i}" value="${esc(r.concepto||'')}" placeholder="Concepto">
              ${r.especial?'<span class="chip ambar">ESPECIAL</span>':''}
            </div>
            <input class="num inv-q" data-f="cantidad" data-i="${i}" inputmode="decimal" value="${esc(r.cantidad)}">
            <span class="inv-u">${esc(r.unidad||'')}</span>
            <input class="num inv-p" data-f="precio" data-i="${i}" inputmode="decimal" value="${esc(r.precio)}">
            <span class="inv-t">${cf(Number(r.cantidad||0)*Number(r.precio||0))}</span>
            <button class="inv-x" data-del="${i}">✕</button>
          </div>`).join('')}
        </div>`:'<div class="sub">Todavía no hay renglones. Agrega del catálogo o crea uno especial.</div>'}

        <div class="row" style="gap:8px;margin:10px 0">
          <button class="btn ghost sm" style="flex:1" id="iv_cat">+ Del catálogo</button>
          <button class="btn ghost sm" style="flex:1" id="iv_esp">+ Renglón especial</button>
        </div>

        <div class="inv-tot">
          <div><span>Subtotal</span><b>${cf(sub)}</b></div>
          <div><span>Impuesto
            <input class="num" id="iv_tax" inputmode="decimal" style="width:62px;display:inline-block;padding:4px 6px"
              value="${esc(j.invoice_tax!=null?j.invoice_tax:0)}">%</span><b>${cf(imp)}</b></div>
          <div class="gr"><span>Total</span><b>${cf(sub+imp)}</b></div>
        </div>

        <label>Notas para el cliente</label>
        <textarea id="iv_nt" placeholder="Lo que quieres que aparezca en la factura">${esc(j.invoice_notas||'')}</textarea>

        <label style="display:flex;align-items:center;gap:9px;margin-top:10px">
          <input type="checkbox" id="iv_pg" style="width:auto" ${j.invoice_pagado?'checked':''}>
          <span>Ya me la pagaron</span></label>

        <div style="height:14px"></div>
        <button class="btn wide" id="iv_ok">Guardar y facturar</button>
        <div style="height:8px"></div>
        <button class="btn ghost wide" id="iv_pdf">Ver la factura</button>
        <div style="height:8px"></div>
        <button class="btn ghost wide" id="c2">Cancelar</button>
      </div></div>`;

    $('#c1').onclick=$('#c2').onclick=cerrar;

    document.querySelectorAll('[data-f]').forEach(el=>{
      el.oninput=()=>{
        const i=+el.dataset.i, f=el.dataset.f;
        INVR[i][f] = (f==='concepto') ? el.value : el.value;
      };
      el.onblur=()=>{ if(el.dataset.f!=='concepto') pinta(); };
    });
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      INVR.splice(+b.dataset.del,1); pinta();
    });
    const tax=$('#iv_tax'); if(tax) tax.onblur=()=>pinta();

    $('#iv_cat').onclick=()=>pickCatalogo();
    $('#iv_esp').onclick=()=>{
      INVR.push({concepto:'', cantidad:1, unidad:'trabajo', precio:'', especial:true});
      pinta();
      setTimeout(()=>{ const e=document.querySelectorAll('.inv-desc'); if(e.length) e[e.length-1].focus(); },40);
    };

    $('#iv_pdf').onclick=()=>{
      if(!INVR.length) return toast('Agrega al menos un renglón.');
      facturaPDF(j, {num:$('#iv_n').value.trim(), fecha:$('#iv_f').value,
        po:$('#iv_po').value.trim(), tax:Number($('#iv_tax').value)||0,
        notas:$('#iv_nt').value.trim(), renglones:INVR});
    };

    $('#iv_ok').onclick=async()=>{
      const num=$('#iv_n').value.trim();
      if(!num) return toast('Pon el número de invoice.');
      if(!INVR.length) return toast('Agrega al menos un renglón.');
      const malos=INVR.filter(r=>!String(r.concepto||'').trim() || !Number(r.precio));
      if(malos.length) return toast('Hay renglones sin concepto o sin precio.');

      const s = INVR.reduce((a,r)=>a+(Number(r.cantidad||0)*Number(r.precio||0)),0);
      const t = Number($('#iv_tax').value)||0;
      const up={
        invoice_num:num,
        invoice_fecha:$('#iv_f').value||hoy(),
        invoice_renglones:INVR,
        invoice_tax:t,
        invoice_monto: Math.round((s + s*t/100)*100)/100,
        invoice_pagado:$('#iv_pg').checked,
        invoice_pago_fecha: $('#iv_pg').checked ? hoy() : null,
        invoice_notas:$('#iv_nt').value.trim()||null,
        invoice_terminos:$('#iv_term').value,
        invoice_vence:venceEl($('#iv_f').value||hoy(), $('#iv_term').value),
        po_number:$('#iv_po').value.trim()||null,
        estatus:'facturado',
        fecha_cierre: j.fecha_cierre || $('#iv_f').value || hoy()
      };
      let docs=(j.docs||[]).filter(x=>x!=='-invoice');
      if(!docs.includes('invoice')) docs.push('invoice');
      up.docs=docs;

      const {error}=await sb.from('jobs').update(up).eq('id',jobId);
      if(error) return toast('No se guardó: '+error.message);
      await notifIns({tipo:'invoice', departamento:'cleaning',
        titulo:'Invoice '+num+' · '+nom,
        texto:`${U.nombre} facturó ${j.folio||''} por ${cf(up.invoice_monto)}`,
        job_id:jobId, de_usuario:U.nombre, para_rol:'admin'});
      cerrar(); toast('Invoice '+num+' · '+cf(up.invoice_monto)); render();
    };
  };

  // ── Escoger del catálogo ──
  function pickCatalogo(){
    if(!PCAT.length){
      return toast('El catálogo de precios está vacío. Cárgalo desde Precios en el menú.');
    }
    const cap=document.createElement('div');
    cap.id='pcap';
    cap.innerHTML=`<div class="ira-bg"></div><div class="ira-box">
      <input id="pcq" placeholder="Busca el servicio…" autocomplete="off">
      <div id="pclist" class="ira-list"></div>
      <div class="ira-pie">Toca uno para agregarlo al invoice</div></div>`;
    document.body.appendChild(cap);
    cap.querySelector('.ira-bg').onclick=()=>cap.remove();
    const lista=()=>{
      const q=($('#pcq').value||'').toLowerCase();
      const R=PCAT.filter(p=>!q || (p.concepto+' '+(p.categoria||'')).toLowerCase().includes(q));
      $('#pclist').innerHTML = R.length ? R.map(p=>`
        <button class="ira-it" data-p="${p.id}">
          <span class="ira-tx"><b>${esc(p.concepto)}</b>
            <em>${p.por_cotizar?'POR COTIZAR · tú pones el precio':cf(p.precio)+' por '+esc(p.unidad)}${
              p.categoria?' · '+esc(p.categoria):''}${p.notas?' · '+esc(p.notas):''}</em></span>
          ${p.propiedad_id?'<span class="chip azul">ESPECIAL</span>':''}
        </button>`).join('') : '<div class="ira-vacio">Nada con ese nombre.</div>';
      $('#pclist').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
        const p=PCAT.find(x=>String(x.id)===b.dataset.p);
        INVR.push({concepto:p.concepto, cantidad:1, unidad:p.unidad,
          precio: p.por_cotizar ? '' : Number(p.precio),
          especial: !!p.propiedad_id || !!p.por_cotizar});
        cap.remove(); pinta();
        if(p.por_cotizar) toast('Ese va por cotización · ponle el precio');
      });
    };
    $('#pcq').oninput=lista; lista();
    setTimeout(()=>$('#pcq').focus(),30);
  }

  pinta();
}

async function cargarPrecios2026(){

  const filas = PRECIOS_2026.map((r,i)=>({
    departamento:'cleaning', categoria:r[0], concepto:r[1], unidad:r[2],
    precio:r[3], notas:r[4]||null, por_cotizar:!!r[5], es_especial:false,
    propiedad_id:null, activo:true, orden:(i+1)*10
  }));
  let ok=0, ya=0, err=null;

  const d1 = HIS.mes ? `${HIS.anio}-${HIS.mes}-01`
                     : `${HIS.anio}-01-01`;

    .select('id,folio,cliente,unidad,tipo,estatus,departamento,fecha_inicio,fecha_cierre,created_at,po_number,invoice_num,invoice_fecha,invoice_monto,invoice_pagado,precio_carpet, managements(id,nombre), propiedades(nombre)')
    .eq('departamento',DEPV())

  ]);

      .filter(Boolean).some(v=>String(v).toLowerCase().includes(n)));

  const facturado = T.filter(x=>x.invoice_num).reduce((a,x)=>a+Number(x.invoice_monto||0),0);
  const cobrado   = T.filter(x=>x.invoice_pagado).reduce((a,x)=>a+Number(x.invoice_monto||0),0);
  const anios=[]; for(let a=hoyA; a>=hoyA-6; a--) anios.push(a);

    '07':'Julio','08':'Agosto','09':'Septiembre','10':'Octubre','11':'Noviembre','12':'Diciembre'};

  // Agrupado por mes cuando ves el año completo
  const porMes={};
  T.forEach(x=>{ const m=(x.fecha_inicio||'').slice(5,7)||'??'; (porMes[m]=porMes[m]||[]).push(x); });

      <span class="chip ${x.invoice_pagado?'verde':x.invoice_num?'azul':x.estatus==='activo'?'ambar':''}">${

  </div>`;

      <div class="stat" style="flex:1"><div class="l">FACTURADO</div>

        <div class="s">${T.filter(x=>x.invoice_num).length} con invoice</div></div>
      <div class="stat" style="flex:1"><div class="l">COBRADO</div>
        <div class="v" style="color:var(--verde)">${dinero?cf(cobrado):T.filter(x=>x.invoice_pagado).length}</div>
        <div class="s">${dinero&&facturado?Math.round(cobrado/facturado*100)+'% del mes':''}</div></div>
    </div>

    ${HIS.mg?`<button class="btn wide no-print" id="h_edo" style="margin-bottom:14px">

    : HIS.mes ? T.map(fila).join('')
    : meses.map(m=>{
        const L=porMes[m], tot=L.reduce((a,x)=>a+monto(x),0);
        return `<div class="eyebrow">${NOMMES[m]||m} · ${L.length} ${L.length===1?'trabajo':'trabajos'}${dinero&&tot?' · '+cf(tot):''}</div>
        ${L.map(fila).join('')}`;
      }).join('')}`;
}

function finDeMes(a,m){
  const d=new Date(Number(a), Number(m), 0);
  return `${a}-${m}-${String(d.getDate()).padStart(2,'0')}`;
}

    let t=null;

async function estadoDeCuenta(mgId, anio, mes){
  if(!mgId) return toast('Escoge primero el management.');
  toast('Armando el estado de cuenta…');
  const d1 = mes ? `${anio}-${mes}-01` : `${anio}-01-01`;
  const d2 = mes ? finDeMes(anio,mes) : `${anio}-12-31`;

  const [{data:mg},{data:J}] = await Promise.all([
    sb.from('managements').select('*').eq('id',mgId).single(),
    sb.from('jobs')
      .select('*, propiedades(nombre)')
      .eq('management_id',mgId).eq('departamento',DEPV())
      .gte('fecha_inicio',d1).lte('fecha_inicio',d2)
      .order('fecha_inicio')
  ]);
  const T=J||[];
  if(!T.length) return toast('No hay trabajos de ese management en el periodo.');

  const E=s=>esc(s==null?'':String(s));
  const Fc=s=>{ if(!s) return '—'; const d=new Date(s+'T12:00:00');
    return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); };
  const NOMMES={'01':'Enero','02':'Febrero','03':'Marzo','04':'Abril','05':'Mayo','06':'Junio',
    '07':'Julio','08':'Agosto','09':'Septiembre','10':'Octubre','11':'Noviembre','12':'Diciembre'};
  const periodo = mes ? `${NOMMES[mes]} ${anio}` : `Ejercicio ${anio}`;
  const M=x=>Number(x.invoice_monto||0)||Number(x.precio_carpet||0);

  const facturados = T.filter(x=>x.invoice_num);
  const pagados    = T.filter(x=>x.invoice_pagado);
  const pendientes = facturados.filter(x=>!x.invoice_pagado);
  const sinFacturar= T.filter(x=>!x.invoice_num && x.estatus==='terminado');
  const abiertos   = T.filter(x=>x.estatus==='activo');
  const tFact=facturados.reduce((a,x)=>a+Number(x.invoice_monto||0),0);
  const tPag =pagados.reduce((a,x)=>a+Number(x.invoice_monto||0),0);
  const tPend=pendientes.reduce((a,x)=>a+Number(x.invoice_monto||0),0);

  const tabla=(lista,conInv)=>`<table><thead><tr>
    <th>Fecha</th><th>Folio</th><th>Propiedad / unidad</th><th>Servicio</th>
    ${conInv?'<th>Invoice</th>':''}<th class="n">Importe</th></tr></thead><tbody>
    ${lista.map(x=>`<tr>
      <td>${Fc(x.fecha_inicio)}</td><td class="m">${E(x.folio)}</td>
      <td>${E(x.propiedades?.nombre||x.cliente)}${x.unidad?' · '+E(x.unidad):''}</td>
      <td>${E(x.tipo)}${x.po_number?'<br><span class="po">PO '+E(x.po_number)+'</span>':''}</td>
      ${conInv?`<td class="m">${E(x.invoice_num||'—')}${x.invoice_fecha?'<br><span class="po">'+Fc(x.invoice_fecha)+'</span>':''}</td>`:''}
      <td class="n">${M(x)?cf(M(x)):'—'}</td></tr>`).join('')}
    </tbody></table>`;
